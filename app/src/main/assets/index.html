<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AFU Forestry MCQ Trainer</title>

<style>
/* VOICE: calm, focused exam companion for a forester
   IDEA: a field notebook / exam booklet from AFU Hetauda
   PICTURE: the live question card is the picture; home shows a canopy band
   COLOUR and TYPE: deep forest green + leaf + crimson accent; Public Sans
   LAYOUT: one column up to 860px, sticky top bar, big tappable options */
:root{color-scheme:light dark;
--bg:light-dark(#f6f8f4,#0e1511);--card:light-dark(#ffffff,#16211b);--ink:light-dark(#14231a,#e5efe8);--mut:light-dark(#5b6d62,#9fb3a6);
--g:light-dark(#1d5a3a,#64c08f);--g2:light-dark(#e3efe6,#1d3326);--line:light-dark(#d5e2d8,#2a3d31);
--gb:light-dark(#1d5a3a,#2f8a58);--ok:light-dark(#127a45,#4fd18b);--okb:light-dark(#e2f5ea,#123222);--bad:light-dark(#b3261e,#ff8a80);--badb:light-dark(#fdeceb,#3a1715);--acc:#c8102e}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Public Sans",system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:5;background:#17472e;color:#fff;display:flex;align-items:center;gap:12px;padding:10px max(4vw,14px)}
.top b{font-size:17px;flex:1}.top button{background:rgba(255,255,255,.14);border:0;border-radius:10px;padding:8px 12px;min-height:40px;color:#fff}
main{max-width:860px;margin:0 auto;padding:18px max(4vw,14px) 80px}
h1{font-size:clamp(28px,5vw,40px);line-height:1.08;margin:6px 0 8px;text-wrap:balance}
h2{font-size:22px;margin:22px 0 10px}
.mut{color:var(--mut)}
.hero{background:linear-gradient(180deg,#1d5a3a 0%,light-dark(#2c7a50,#1f4b33) 100%);color:#fff;border-radius:18px;padding:22px;position:relative;overflow:hidden}
.hero svg{position:absolute;right:-10px;bottom:-6px;width:58%;max-width:360px;opacity:.9}
.hero p{max-width:60%;margin:0 0 14px}
.stats{display:flex;flex-wrap:wrap;gap:8px;position:relative}
.pill{background:rgba(255,255,255,.16);border-radius:999px;padding:5px 12px;font-size:14px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px;margin-top:16px}
.mode{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;min-height:132px}
.mode h3{margin:0 0 4px;font-size:19px;color:var(--g)}.mode p{margin:0;color:var(--mut);font-size:14.5px}
.mode .n{font-weight:800;font-size:26px;color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;min-height:42px}
.chip[aria-pressed=true]{background:var(--gb);color:#fff;border-color:var(--gb)}
.btn{background:var(--gb);color:#fff;border:0;border-radius:12px;padding:12px 18px;min-height:46px;font-weight:600}
.btn.alt{background:var(--g2);color:var(--ink)}.btn.warn{background:var(--acc)}
.list{display:grid;gap:8px}
.item{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;width:100%}
.item .t{flex:1}.item .s{font-size:13.5px;color:var(--mut)}
.bar{height:6px;background:var(--g2);border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--g)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.qhead{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--mut);margin-bottom:8px;flex-wrap:wrap}
.qtext{font-size:18.5px;font-weight:600;line-height:1.45;margin:4px 0 14px}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;min-height:50px;align-items:flex-start}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--g2);font-weight:700;font-size:14px}
.opt:hover{border-color:var(--g)}
.opt.sel{border-color:var(--g);background:var(--g2)}
.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badb)}.opt.bad .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.fb{border-radius:14px;padding:14px 16px;margin-top:12px;font-size:15.5px}
.fb.ok{background:var(--okb);border-left:5px solid var(--ok)}.fb.bad{background:var(--badb);border-left:5px solid var(--bad)}
.fb h4{margin:0 0 6px;font-size:17px}.fb p{margin:6px 0}
.nav{display:flex;gap:8px;justify-content:space-between;margin-top:14px;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;font-weight:800;background:rgba(255,255,255,.18);padding:6px 12px;border-radius:10px}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:12px}
.pal button{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:13px}
.pal .a{background:var(--gb);color:#fff;border-color:var(--gb)}.pal .f{outline:2px solid var(--acc)}.pal .c{box-shadow:0 0 0 2px var(--ink) inset}
.pal .r{background:var(--okb);border-color:var(--ok)}.pal .w{background:var(--badb);border-color:var(--bad)}
.notes{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 18px 16px}
.notes table{border-collapse:collapse;width:100%;font-size:14px;display:block;overflow-x:auto}
.notes th,.notes td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}.notes th{background:var(--g2)}
.notes h3{color:var(--g)}.notes .box{background:var(--g2);border-radius:10px;padding:10px 12px}
.score{font-size:clamp(44px,10vw,72px);font-weight:800;line-height:1;color:var(--g)}
table.res{width:100%;border-collapse:collapse;font-size:14.5px}table.res td,table.res th{padding:8px;border-bottom:1px solid var(--line);text-align:left}
table.res td:not(:first-child),table.res th:not(:first-child){text-align:right;white-space:nowrap}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px;z-index:9}
.dlg>div{background:var(--card);border-radius:16px;padding:20px;max-width:420px;width:100%}
.btn:disabled{opacity:.45;cursor:default}
.bm{background:none;border:0;font-size:14px;color:var(--g);padding:4px 0;min-height:32px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media(max-width:600px){.hero p{max-width:100%}.hero svg{position:static;width:100%;max-width:none;margin-top:8px}.qtext{font-size:17px}}
@media(prefers-reduced-motion:no-preference){.fb{animation:up .25s ease}@keyframes up{from{opacity:0;transform:translateY(6px)}}}
</style>
</head>

<script>window.__Q={"subjects":{"silv":"Silviculture","fm":"Forest Management","eco":"Forest Ecology","af":"Agroforestry","prot":"Forest Protection","cf":"Community Forestry","soil":"Soil Conservation","util":"Forest Utilization","ws":"Watershed Management","wl":"Wildlife & Protected Areas","mens":"Mensuration, Biometrics & Research"},"quota":{"silv":10,"fm":10,"eco":5,"af":5,"prot":5,"cf":10,"soil":10,"util":10,"ws":5,"wl":10,"mens":10},"questions":[{"id":0,"s":"silv","q":"Seeds of <i>Shorea robusta</i> are best described as:","o":["Recalcitrant, viable for about a week","Intermediate, viable for 6 months","Orthodox, viable for years","Dormant, need stratification"],"a":0,"e":"Sal seed loses viability within ~1 week; sow fresh in the rainy season.","w":{},"p":"study","t":""},{"id":1,"s":"silv","q":"Which species is a non-leguminous nitrogen fixer used on landslides?","o":["<i>Pinus roxburghii</i>","<i>Alnus nepalensis</i>","<i>Schima wallichii</i>","<i>Castanopsis indica</i>"],"a":1,"e":"Utis fixes N through the actinomycete <i>Frankia</i>.","w":{},"p":"study","t":""},{"id":2,"s":"silv","q":"The rotation of maximum volume production is reached when:","o":["MAI is maximum (CAI = MAI)","CAI is maximum","Growing stock is maximum","CAI becomes zero"],"a":0,"e":"CAI cuts MAI at the peak of MAI.","w":{},"p":"study","t":""},{"id":3,"s":"silv","q":"Regeneration felling, secondary felling and final felling are stages of:","o":["Clear felling system","Selection system","Coppice with standards","Shelterwood system"],"a":3,"e":"Uniform shelterwood: preparatory → seeding → secondary → final fellings.","w":{},"p":"study","t":""},{"id":4,"s":"silv","q":"Cutting a tree at 2–3 m height to obtain repeated shoots out of reach of cattle is:","o":["Lopping","Coppicing","Pruning","Pollarding"],"a":3,"e":"Pollarding = coppicing at height.","w":{},"p":"study","t":""},{"id":5,"s":"silv","q":"The tetrazolium test is used to determine seed:","o":["Purity","Weight","Viability","Moisture"],"a":2,"e":"Living tissue reduces TTC to red formazan.","w":{},"p":"practice","t":""},{"id":6,"s":"silv","q":"Number of forest types described by Stainton (1972) for Nepal:","o":["18","35","118","25"],"a":1,"e":"118 is the number of ecosystems (BPP 1995).","w":{},"p":"study","t":""},{"id":7,"s":"silv","q":"Genetic gain when h² = 0.4 and selection differential = 10 cm is:","o":["25 cm","2.5 cm","4 cm","0.4 cm"],"a":2,"e":"ΔG = h² × S = 0.4 × 10 = 4 cm.","w":{},"p":"practice","t":""},{"id":8,"s":"silv","q":"Which is NOT a locality factor?","o":["Rainfall","Rotation age","Aspect","Soil depth"],"a":1,"e":"Rotation is a management decision, not a site factor.","w":{},"p":"study","t":""},{"id":9,"s":"silv","q":"<i>Pinus wallichiana</i> is distinguished from <i>Pinus roxburghii</i> by having:","o":["Single needles","5 needles per fascicle","3 needles per fascicle","2 needles per fascicle"],"a":1,"e":"Blue pine 5; chir pine 3.","w":{},"p":"practice","t":""},{"id":10,"s":"silv","q":"A seed orchard established from grafts of plus trees is called:","o":["Provenance trial","Seed production area","Seedling seed orchard","Clonal seed orchard"],"a":3,"e":"Clonal (vegetative) propagation of selected plus trees.","w":{},"p":"practice","t":""},{"id":11,"s":"silv","q":"Collaborative forest became a separate category of national forest under:","o":["Forest Policy 2071","Master Plan 1988","Forest Act 2076","Forest Act 2049"],"a":2,"e":"Forest Act 2076 (2019) recognises collaborative forest; CFM itself began in Terai after Forest Policy 2000.","w":{},"p":"study","t":""},{"id":12,"s":"silv","q":"Removal of the suppressed and dominated trees first is characteristic of:","o":["Selection thinning","Crown thinning","Free thinning","Low (ordinary) thinning"],"a":3,"e":"Low thinning works from below.","w":{},"p":"study","t":""},{"id":13,"s":"silv","q":"Hot-water treatment before sowing is most appropriate for:","o":["<i>Quercus semecarpifolia</i>","<i>Syzygium cumini</i>","<i>Acacia catechu</i>","<i>Shorea robusta</i>"],"a":2,"e":"Hard-coated leguminous seed.","w":{},"p":"practice","t":""},{"id":14,"s":"silv","q":"Which species is most typical of the subalpine zone of Nepal?","o":["<i>Dalbergia sissoo</i>","<i>Schima wallichii</i>","<i>Terminalia alata</i>","<i>Abies spectabilis</i>"],"a":3,"e":"Silver fir with birch and rhododendron at 3,000–4,000 m.","w":{},"p":"study","t":""},{"id":15,"s":"fm","q":"A forest has growing stock 12,000 m³ and rotation 60 years. Annual yield by Von Mantel's formula:","o":["200 m³","400 m³","720 m³","600 m³"],"a":1,"e":"Y = 2V/R = 24,000/60 = 400 m³.","w":{},"p":"study","t":""},{"id":16,"s":"fm","q":"A coppice forest of 600 ha on 30-year rotation. Annual coupe by area method:","o":["10 ha","18 ha","20 ha","30 ha"],"a":2,"e":"Area method: annual coupe = total area ÷ rotation = 600 ÷ 30 = 20 ha. Each year one coupe is cut, so after 30 years the whole forest is cut once and the first coupe is again 30 years old.","w":{},"p":"study","t":""},{"id":17,"s":"fm","q":"Austrian formula: I = 500, Ga = 20,000, Gn = 18,000, adjustment period 20 yrs. Yield =","o":["500 m³","400 m³","600 m³","1,500 m³"],"a":2,"e":"Austrian (Karl's) formula Y = I + (Ga − Gn)/a = 500 + (20,000 − 18,000)/20 = 500 + 100 = 600 m³. The surplus growing stock is removed gradually over the adjustment period.","w":{},"p":"study","t":""},{"id":18,"s":"fm","q":"MAI of a stand with 300 m³/ha at age 50 is:","o":["6 m³/ha/yr","15 m³/ha/yr","3 m³/ha/yr","60 m³/ha/yr"],"a":0,"e":"MAI = total volume ÷ age = 300 ÷ 50 = 6 m³/ha/yr. MAI rises, peaks and then falls; the peak marks the rotation of maximum volume production.","w":{},"p":"practice","t":""},{"id":19,"s":"fm","q":"Which is NOT a characteristic of a normal forest?","o":["Normal increment","Normal age-class distribution","Uniform species composition","Normal growing stock"],"a":2,"e":"Species composition is not one of the three attributes.","w":{},"p":"practice","t":""},{"id":20,"s":"fm","q":"Removal of defective, diseased and undesirable trees to favour crop trees is:","o":["Pruning","Beating up","Cleaning","TSI"],"a":3,"e":"Timber Stand Improvement.","w":{},"p":"study","t":""},{"id":21,"s":"fm","q":"Replacing dead seedlings in a plantation is called:","o":["Beating up","Thinning","Weeding","Singling"],"a":0,"e":"Also called casualty replacement.","w":{},"p":"study","t":""},{"id":22,"s":"fm","q":"Under Forest Act 2076, a CFUG must spend at least what share of its income on forest development, management and protection?","o":["50%","10%","35%","25%"],"a":3,"e":"25% for forest; then ≥50% of the remainder for pro-poor/women/enterprise.","w":{},"p":"study","t":""},{"id":23,"s":"fm","q":"'Second-generation issues' of community forestry mainly refer to:","o":["Plantation establishment","Governance, equity and livelihood","Boundary survey","Formation of user groups"],"a":1,"e":"Emphasised from the 4th national CF workshop (2004).","w":{},"p":"practice","t":""},{"id":24,"s":"fm","q":"Radius of a 250 m² circular sample plot is about:","o":["12.62 m","7.98 m","5.64 m","8.92 m"],"a":3,"e":"r = √(A/π) = √(250/3.1416) = √79.58 = 8.92 m. Common CF plot radii: 8.92 m (250 m²), 5.64 m (100 m²), 2.82 m (25 m²), 0.56 m (1 m²).","w":{},"p":"study","t":""},{"id":25,"s":"fm","q":"The interval between successive fellings on the same area in a selection forest is:","o":["Felling cycle","Conversion period","Regeneration period","Rotation"],"a":0,"e":"The felling cycle applies to selection/uneven-aged forests: each part is worked once per cycle (e.g. every 10 years). Rotation is for even-aged crops; regeneration period is the time to establish a new crop under shelterwood.","w":{},"p":"study","t":""},{"id":26,"s":"fm","q":"Normal growing stock of a forest with rotation 40 yrs and total annual increment 1,000 m³ is:","o":["40,000 m³","80,000 m³","20,000 m³","25,000 m³"],"a":2,"e":"Gn = R × I / 2 = 40 × 1,000 / 2.","w":{},"p":"practice","t":""},{"id":27,"s":"fm","q":"Volume equations widely used in Nepal's forest inventories were developed by:","o":["Sharma &amp; Pukkala","Stainton","Champion &amp; Seth","Jackson"],"a":0,"e":"Sharma &amp; Pukkala (1990): ln V = a + b ln D + c ln H.","w":{},"p":"practice","t":""},{"id":28,"s":"fm","q":"Which document guides yearly harvesting in a community forest?","o":["District forest sector plan","Operational plan","Annual audit report","Constitution (Bidhan)"],"a":1,"e":"The OP fixes block-wise allowable harvest.","w":{},"p":"study","t":""},{"id":29,"s":"fm","q":"Periodic annual increment (PAI) is:","o":["Increment from planting to rotation","Volume ÷ age","Increment of the last year","Increment over a period ÷ number of years"],"a":3,"e":"PAI = (V₂ − V₁)/n, the average annual growth over a measured period. CAI is the growth in a single year; MAI is total volume ÷ age.","w":{},"p":"study","t":""},{"id":30,"s":"eco","q":"The term 'ecosystem' was coined by:","o":["Clements","Tansley","Odum","Haeckel"],"a":1,"e":"A.G. Tansley coined 'ecosystem' in 1935. Ernst Haeckel coined 'ecology' (1869); E.P. Odum popularised ecosystem ecology; Clements is known for succession and monoclimax.","w":{},"p":"practice","t":""},{"id":31,"s":"eco","q":"Net primary productivity equals:","o":["GPP + R","GPP − R","NEP − R","GPP × R"],"a":1,"e":"NPP = GPP − R (autotrophic respiration). It is the energy/biomass available to consumers. NEP further subtracts heterotrophic respiration.","w":{},"p":"practice","t":""},{"id":32,"s":"eco","q":"Retrogressive succession in the mid-hills is mostly caused by:","o":["High rainfall","Fire, overgrazing and lopping","Seed dormancy","Nitrogen fixation"],"a":1,"e":"Biotic pressure pushes communities backward.","w":{},"p":"study","t":""},{"id":33,"s":"eco","q":"For 4 species in equal abundance, the Shannon index H′ (natural log) is:","o":["1.00","4.00","0.25","1.39"],"a":3,"e":"With 4 equally abundant species, pᵢ = 0.25, so H′ = −4 × 0.25 × ln 0.25 = ln 4 = 1.386. Equal abundance gives the maximum H′ for a given number of species (evenness J = 1).","w":{},"p":"practice","t":""},{"id":34,"s":"eco","q":"Genetically distinct populations adapted to local habitat are called:","o":["Ecads","Ecotypes","Seres","Ecophenes"],"a":1,"e":"Ecotypes (Turesson 1922) are genetically adapted local populations – heritable. Ecophenes/ecads are non-heritable environmental modifications (phenotypic plasticity). A sere is a successional sequence.","w":{},"p":"study","t":""},{"id":35,"s":"eco","q":"Maximum value of IVI for a species in a stand is:","o":["200","400","300","100"],"a":2,"e":"Sum of three relative values (each max 100).","w":{},"p":"practice","t":""},{"id":36,"s":"eco","q":"Sørensen similarity when site A has 20 species, B has 30 and 10 are common:","o":["0.25","0.50","0.33","0.40"],"a":3,"e":"Sørensen = 2C/(A + B) = 2 × 10/(20 + 30) = 0.40. Jaccard for the same data = C/(A + B − C) = 10/40 = 0.25.","w":{},"p":"study","t":""},{"id":37,"s":"eco","q":"Diameter distribution of an uneven-aged forest typically is:","o":["Reverse-J shaped","Bell-shaped","Uniform","Bimodal always"],"a":0,"e":"Negative exponential; de Liocourt q-ratio.","w":{},"p":"practice","t":""},{"id":38,"s":"eco","q":"Pollination by bees is which category of ecosystem service?","o":["Regulating","Provisioning","Supporting","Cultural"],"a":0,"e":"MEA (2005): provisioning (products), regulating (pollination, climate, flood and pest regulation), cultural (recreation, spiritual), supporting (soil formation, nutrient cycling).","w":{},"p":"practice","t":""},{"id":39,"s":"eco","q":"Release of juglone by walnut affecting other plants is an example of:","o":["Amensalism (allelopathy)","Predation","Commensalism","Mutualism"],"a":0,"e":"Juglone from walnut inhibits other plants while the walnut is unaffected – amensalism (−/0) through allelopathy. Commensalism is +/0; mutualism +/+.","w":{},"p":"practice","t":""},{"id":40,"s":"af","q":"Trees + crops + animals on the same land unit is classified as:","o":["Taungya","Agrosilvopastoral","Silvopastoral","Agrisilviculture"],"a":1,"e":"Home gardens are a typical example.","w":{},"p":"practice","t":""},{"id":41,"s":"af","q":"Taungya system originated in:","o":["Kenya","Nepal","India","Burma (Myanmar)"],"a":3,"e":"Taungya ('hill cultivation' in Burmese) was formalised in Burma in the 1850s under Dietrich Brandis: farmers grow crops between young teak rows in exchange for planting and tending trees.","w":{},"p":"practice","t":""},{"id":42,"s":"af","q":"The Diagnosis &amp; Design methodology was developed by:","o":["ICRAF","IUCN","CIFOR","FAO"],"a":0,"e":"D&D was developed by ICRAF (J.B. Raintree, 1987) to diagnose land-use problems with farmers and design agroforestry solutions. ICRAF is now part of CIFOR-ICRAF.","w":{},"p":"practice","t":""},{"id":43,"s":"af","q":"An LER of 1.3 indicates:","o":["30% yield loss from intercropping","No interaction","Intercropping is 30% more land-efficient than sole crops","Tree dominance"],"a":2,"e":"LER = Σ(intercrop yield/sole yield). LER 1.3 means 1.3 ha of sole crops would be needed to equal the output of 1 ha of the mixture – a 30% land-use advantage.","w":{},"p":"study","t":""},{"id":44,"s":"af","q":"Which is a fodder tree widely grown on terrace risers in the mid-hills?","o":["<i>Pinus roxburghii</i>","<i>Ficus semicordata</i>","<i>Abies spectabilis</i>","<i>Shorea robusta</i>"],"a":1,"e":"Khanyu (Ficus semicordata) is a top winter fodder tree on bari terrace risers. Chir pine, Sal and silver fir are not fodder trees.","w":{},"p":"practice","t":""},{"id":45,"s":"af","q":"Nepal's National Agroforestry Policy was approved in:","o":["2076 BS","2071 BS","2066 BS","2080 BS"],"a":0,"e":"Nepal adopted its National Agroforestry Policy in 2076 BS (2019 AD), promoting trees on farms, agroforestry in community forests and enterprise.","w":{},"p":"study","t":""},{"id":46,"s":"af","q":"Uptake of nutrients from deep soil and their deposition on the surface through litter is:","o":["Volatilisation","Leaching","Fixation","Nutrient pumping"],"a":3,"e":"Nutrient pumping: deep tree roots take up nutrients below the crop root zone and return them via litterfall, improving topsoil fertility – a 'safety net' against leaching.","w":{},"p":"study","t":""},{"id":47,"s":"af","q":"Alley cropping uses mainly:","o":["Pruned N-fixing hedgerows","Tall timber trees","Grasses only","Fruit trees only"],"a":0,"e":"Alley cropping (hedgerow intercropping) grows crops in alleys between rows of N-fixing shrubs/trees (Leucaena, Gliricidia, Flemingia) that are pruned regularly; prunings are used as mulch or fodder.","w":{},"p":"study","t":""},{"id":48,"s":"af","q":"Which property is NOT desirable in fuelwood?","o":["High ash content","High density","High calorific value","Low moisture"],"a":0,"e":"Good fuelwood has high density and calorific value, low moisture and low ash. High ash lowers useful heat and the Fuel Value Index = (CV × density)/(ash × moisture).","w":{},"p":"study","t":""},{"id":49,"s":"af","q":"Utis is commonly combined with which cash crop in eastern Nepal?","o":["Rice","Large cardamom","Tea","Coffee"],"a":1,"e":"Large cardamom (Amomum subulatum) is grown under Utis shade in Ilam, Taplejung, Panchthar; Utis fixes nitrogen through Frankia and its litter enriches soil.","w":{},"p":"study","t":""},{"id":50,"s":"prot","q":"The most common type of forest fire in Nepal is:","o":["Ground fire","Crown fire","Peat fire","Surface fire"],"a":3,"e":"Surface fires burning litter, grass and undergrowth dominate in Nepal, mostly in the dry season (Feb–May). Crown fires occur mainly in chir pine; ground fires are rare.","w":{},"p":"practice","t":""},{"id":51,"s":"prot","q":"The trap-tree method is used to control:","o":["Cutworms","Termites","Teak defoliator","Sal heartwood borer"],"a":3,"e":"<i>Hoplocerambyx spinicornis</i>.","w":{},"p":"practice","t":""},{"id":52,"s":"prot","q":"Sissoo die-back in Nepal is mainly associated with:","o":["<i>Fusarium solani</i>","<i>Corticium salmonicolor</i>","<i>Phellinus caryophylli</i>","<i>Cronartium ribicola</i>"],"a":0,"e":"Sissoo die-back/wilt, associated with Fusarium solani (often with stress and root damage), killed large numbers of Sissoo in Terai plantations from the late 1990s.","w":{},"p":"practice","t":""},{"id":53,"s":"prot","q":"Damping-off in nurseries is NOT caused by:","o":["<i>Hyblaea</i>","<i>Pythium</i>","<i>Fusarium</i>","<i>Rhizoctonia</i>"],"a":0,"e":"<i>Hyblaea puera</i> is an insect.","w":{},"p":"study","t":""},{"id":54,"s":"prot","q":"<i>Mikania micrantha</i> is a major problem in:","o":["Trans-Himalaya","Temperate conifer forests","Chitwan grasslands and forests","Alpine meadows"],"a":2,"e":"Mikania micrantha (mile-a-minute) is a fast climber that smothers grasslands and forest edges in Chitwan, reducing rhino and deer forage.","w":{},"p":"study","t":""},{"id":55,"s":"prot","q":"Bordeaux mixture contains:","o":["CuSO₄ + lime","FeSO₄ + urea","ZnSO₄ + lime","CuSO₄ + sulphur"],"a":0,"e":"Bordeaux mixture = copper sulphate + quicklime + water (1:1:100), a fungicide for nursery and foliar diseases.","w":{},"p":"practice","t":""},{"id":56,"s":"prot","q":"<i>Hypsipyla robusta</i> attacks the shoots of:","o":["Pine","Teak","Sal","Toona"],"a":3,"e":"Hypsipyla robusta larvae bore into leading shoots of Toona (and mahogany), causing forking and poor stem form; mixed planting and shade reduce attack.","w":{},"p":"study","t":""},{"id":57,"s":"prot","q":"Which is a total stem parasite?","o":["<i>Viscum</i>","<i>Cuscuta</i>","<i>Dendrophthoe</i>","<i>Loranthus</i>"],"a":1,"e":"Mistletoes are partial (hemi-) parasites.","w":{},"p":"study","t":""},{"id":58,"s":"prot","q":"Peak forest-fire months in Nepal are:","o":["Poush–Magh","Kartik–Mangsir","Shrawan–Bhadra","Chaitra–Baishakh"],"a":3,"e":"Chaitra–Baishakh (mid-March to mid-May) is the driest, hottest pre-monsoon period, when most fires occur.","w":{},"p":"study","t":""},{"id":59,"s":"prot","q":"Fire triangle consists of:","o":["Heat, humidity, wind","Fuel, wind, slope","Fuel, oxygen, heat","Oxygen, CO₂, heat"],"a":2,"e":"Fire needs fuel, oxygen and heat. Fire control removes one side: fire lines remove fuel, water/soil cools and smothers.","w":{},"p":"study","t":""},{"id":60,"s":"cf","q":"The first legal recognition of community-based forest management in Nepal came through:","o":["Forest Act 2049","Forest Act 2018","Panchayat Forest &amp; Panchayat Protected Forest Rules 2035","Forest Policy 2075"],"a":2,"e":"The Panchayat Forest (PF) and Panchayat Protected Forest (PPF) Rules 2035 BS (1978) let forests be handed to local Panchayats – the legal start of community forestry. MPFS (1988) shifted to user groups; Forest Act 2049 gave CFUGs autonomy.","w":{},"p":"study","t":""},{"id":61,"s":"cf","q":"Master Plan for the Forestry Sector was approved in:","o":["2000","1993","1976","1988"],"a":3,"e":"The MPFS was prepared 1986–88 and approved in 1988 (2045 BS) as a 21-year plan, giving priority to community and private forestry.","w":{},"p":"study","t":""},{"id":62,"s":"cf","q":"How many primary programmes were in the MPFS?","o":["4","8","5","6"],"a":3,"e":"Plus six supportive programmes.","w":{},"p":"practice","t":""},{"id":63,"s":"cf","q":"Which is NOT one of the five livelihood capitals?","o":["Political","Social","Natural","Financial"],"a":0,"e":"Natural, Physical, Human, Social, Financial.","w":{},"p":"study","t":""},{"id":64,"s":"cf","q":"PRA is mainly associated with:","o":["Gifford Pinchot","Robert Chambers","P.K.R. Nair","Dietrich Brandis"],"a":1,"e":"Robert Chambers (IDS, Sussex) popularised RRA and PRA in the 1980s–90s. Gifford Pinchot was the first chief of the US Forest Service; Brandis founded scientific forestry in British India; Nair classified agroforestry.","w":{},"p":"practice","t":""},{"id":65,"s":"cf","q":"The supreme body of a CFUG is:","o":["FECOFUN","General assembly","Division Forest Office","Executive committee"],"a":1,"e":"The general assembly of all user households is the supreme body: it approves the constitution and OP and elects the executive committee.","w":{},"p":"practice","t":""},{"id":66,"s":"cf","q":"FECOFUN was established in:","o":["1993","1995","1988","2000"],"a":1,"e":"FECOFUN (Federation of Community Forestry Users, Nepal) was formed in 1995 to advocate for CFUG rights; it has district and national chapters.","w":{},"p":"study","t":""},{"id":67,"s":"cf","q":"Which tool ranks households by economic status in CF?","o":["Seasonal calendar","Venn diagram","Transect walk","Well-being ranking"],"a":3,"e":"Well-being (wealth) ranking groups households (e.g. rich, medium, poor, very poor) using local criteria; used to target pro-poor programmes.","w":{},"p":"practice","t":""},{"id":68,"s":"cf","q":"Which document of a CFUG contains rules on membership and committee?","o":["Annual plan","Operational plan","Inventory report","Constitution (Bidhan)"],"a":3,"e":"The constitution (bidhan) contains organisational rules – membership, committee, meetings, fund, penalties. The OP contains forest management prescriptions.","w":{},"p":"practice","t":""},{"id":69,"s":"cf","q":"Under CF guidelines, women's share in the CFUG executive committee should be at least:","o":["60%","50%","33%","25%"],"a":1,"e":"And chair or secretary must be a woman.","w":{},"p":"study","t":""},{"id":70,"s":"cf","q":"A Venn (chapati) diagram in PRA shows:","o":["Historical events","Seasonal workload","Land use along a line","Institutions and their importance/relationship"],"a":3,"e":"Circles of different size represent institutions (importance); their distance from the community circle shows closeness/accessibility.","w":{},"p":"practice","t":""},{"id":71,"s":"cf","q":"The Forest Act 2049 made CFUGs:","o":["Government agencies","Autonomous corporate bodies with perpetual succession","Private companies","Branches of the DFO"],"a":1,"e":"Forest Act 2049 recognised CFUGs as autonomous, self-governing corporate bodies with perpetual succession, able to own property, sue and be sued.","w":{},"p":"practice","t":""},{"id":72,"s":"cf","q":"Cross-checking information from several sources/tools in PRA is called:","o":["Optimal ignorance","Probing","Sampling","Triangulation"],"a":3,"e":"Triangulation cross-checks data using different tools, sources and team members to reduce bias.","w":{},"p":"practice","t":""},{"id":73,"s":"cf","q":"Which project worked in Sindhupalchok and Kabhre from 1978?","o":["MSFP","LFP","Nepal–Swiss CF Project","Nepal–Australia Forestry Project"],"a":3,"e":"The Nepal–Australia Forestry Project (later Nepal–Australia Community Resource Management Project) began in 1978 in Sindhupalchok and Kabhrepalanchok and pioneered user-group forestry.","w":{},"p":"practice","t":""},{"id":74,"s":"cf","q":"Number of CFUGs managing forests in Nepal (MoFE, mid-March 2025) was about:","o":["32,000","14,000","23,600","18,500"],"a":2,"e":"23,601 CFUGs, ~2.51 million ha.","w":{},"p":"practice","t":""},{"id":75,"s":"mens","q":"Basal area of a tree with DBH 40 cm is:","o":["0.0126 m²","0.502 m²","1.257 m²","0.1257 m²"],"a":3,"e":"0.7854 × 0.4² = 0.1257 m².","w":{},"p":"practice","t":""},{"id":76,"s":"mens","q":"A log 4 m long has end areas 0.20 and 0.10 m². Volume by Smalian's formula:","o":["0.40 m³","1.20 m³","0.80 m³","0.60 m³"],"a":3,"e":"(0.2+0.1)/2 × 4 = 0.6 m³.","w":{},"p":"study","t":""},{"id":77,"s":"mens","q":"The most accurate log-volume formula is:","o":["Huber","Smalian","Hoppus","Newton"],"a":3,"e":"Newton's (prismoidal) formula uses both ends and the middle, V = (A₁ + 4A_m + A₂)L/6, and is the most accurate. Huber uses the middle only; Smalian the ends only.","w":{},"p":"practice","t":""},{"id":78,"s":"mens","q":"The instrument used to extract cores for age and increment is:","o":["Biltmore stick","Abney level","Relascope","Pressler increment borer"],"a":3,"e":"The Pressler increment borer extracts a thin core from bark to pith for ring counting (age) and radial growth measurement.","w":{},"p":"practice","t":""},{"id":79,"s":"mens","q":"NDVI when NIR reflectance = 0.5 and red = 0.1:","o":["0.67","0.83","0.40","0.50"],"a":0,"e":"NDVI = (0.5 − 0.1)/(0.5 + 0.1) = 0.4/0.6 = 0.67. Dense healthy vegetation is typically 0.6–0.9; bare soil ~0.1–0.2; water negative.","w":{},"p":"study","t":""},{"id":80,"s":"mens","q":"Required number of plots if CV = 40%, allowable error = 10%, t = 2:","o":["160","32","64","16"],"a":2,"e":"n = t²CV²/E² = 2² × 40²/10² = 4 × 1600/100 = 64 plots.","w":{},"p":"study","t":""},{"id":81,"s":"mens","q":"Standard error when s = 20 and n = 25:","o":["5","0.8","20","4"],"a":3,"e":"SE = s/√n = 20/√25 = 20/5 = 4.","w":{},"p":"study","t":""},{"id":82,"s":"mens","q":"Photo scale with focal length 152 mm and flying height 3,040 m:","o":["1:200,000","1:2,000","1:15,200","1:20,000"],"a":3,"e":"Scale = f/H = 0.152 m / 3,040 m = 1/20,000.","w":{},"p":"practice","t":""},{"id":83,"s":"mens","q":"Error degrees of freedom in an RCBD with 5 treatments and 4 replications:","o":["16","19","12","15"],"a":2,"e":"Error df = (t − 1)(r − 1) = 4 × 3 = 12. Total df = 19, treatment df = 4, block df = 3.","w":{},"p":"study","t":""},{"id":84,"s":"mens","q":"A design with two error terms, main plots and sub-plots is:","o":["CRD","Split plot","RCBD","Latin square"],"a":1,"e":"Split-plot design has main plots (factor A, error a) and sub-plots (factor B and A×B, error b). Used when one factor needs large plots (e.g. irrigation).","w":{},"p":"practice","t":""},{"id":85,"s":"mens","q":"To compare means of three or more treatments use:","o":["ANOVA","Correlation","χ² test","t-test"],"a":0,"e":"ANOVA partitions variance and tests F = MS treatment/MS error. Multiple t-tests inflate Type I error.","w":{},"p":"practice","t":""},{"id":86,"s":"mens","q":"Prismatic compass reads:","o":["Quadrantal bearings","Reduced bearings only","Whole circle bearings","Magnetic dip"],"a":2,"e":"The prismatic compass gives whole circle bearings (0–360°); the surveyor's compass gives quadrantal (reduced) bearings like N 30° E.","w":{},"p":"study","t":""},{"id":87,"s":"mens","q":"Nepal's national map projection is:","o":["UTM zone 43","Mercator on WGS84","MUTM on Everest 1830","Lambert conformal"],"a":2,"e":"Nepal's topographic maps use MUTM (Modified UTM) on the Everest 1830 spheroid with 3° zones (CM 81°, 84°, 87° E) and scale factor 0.9999.","w":{},"p":"study","t":""},{"id":88,"s":"mens","q":"Forest cover of Nepal reported by MoFE for 2024 (forest + shrub) is:","o":["48.5%","39.6%","46.08%","44.74%"],"a":2,"e":"43.38% forest + 2.70% shrub.","w":{},"p":"practice","t":""},{"id":89,"s":"mens","q":"Point (angle-count) sampling selects trees with probability proportional to:","o":["Crown width","Height","Volume","Basal area"],"a":3,"e":"Bitterlich angle-count sampling includes trees with probability proportional to their basal area; count × BAF = basal area per hectare.","w":{},"p":"study","t":""},{"id":90,"s":"mens","q":"Pressler growth percent for V₁ = 100, V₂ = 121 over 10 years is about:","o":["10%","2.1%","1.9%","21%"],"a":2,"e":"(21/221) × 200/10 = 1.90%.","w":{},"p":"study","t":""},{"id":91,"s":"mens","q":"Gunter's chain is:","o":["30 m","66 ft","20 m","100 ft"],"a":1,"e":"Gunter's chain = 66 ft = 100 links (1 link = 7.92 inches); 10 square chains = 1 acre. Metric chains are 20 m or 30 m.","w":{},"p":"practice","t":""},{"id":92,"s":"soil","q":"Correct order of water-erosion development is:","o":["Rill → sheet → splash → gully","Gully → rill → sheet → splash","Sheet → splash → gully → rill","Splash → sheet → rill → gully"],"a":3,"e":"Raindrop splash detaches particles → sheet flow removes a thin layer → flow concentrates into rills → rills deepen into gullies.","w":{},"p":"study","t":""},{"id":93,"s":"soil","q":"In USLE, the factor C stands for:","o":["Climate","Cover-management","Conservation structure","Clay content"],"a":1,"e":"P is the support-practice factor.","w":{},"p":"study","t":""},{"id":94,"s":"soil","q":"Soil horizon of illuviation (accumulation) is:","o":["E","A","B","C"],"a":2,"e":"The B horizon receives clay, iron, aluminium and humus washed down from A/E horizons (illuviation). E is the zone of eluviation (loss).","w":{},"p":"study","t":""},{"id":95,"s":"soil","q":"Which is a passive soil-forming factor?","o":["Parent material","Organisms","Climate","Vegetation"],"a":0,"e":"Relief, parent material and time are passive.","w":{},"p":"practice","t":""},{"id":96,"s":"soil","q":"Organic carbon in soil is determined by:","o":["Kjeldahl method","Flame photometry","Olsen method","Walkley &amp; Black method"],"a":3,"e":"Walkley & Black wet oxidation with potassium dichromate and sulphuric acid; OM = OC × 1.724.","w":{},"p":"study","t":""},{"id":97,"s":"soil","q":"The main mode of soil movement in wind erosion is:","o":["Suspension","Rolling","Saltation","Surface creep"],"a":2,"e":"Saltation (bouncing of 0.1–0.5 mm grains) carries 50–75% of wind-eroded soil; suspension moves fine dust; surface creep rolls coarse grains.","w":{},"p":"practice","t":""},{"id":98,"s":"soil","q":"Land capability classes not suitable for cultivation are:","o":["II–V","V–VIII","VII–VIII only","I–IV"],"a":1,"e":"Classes I–IV are arable with increasing limitations; V–VIII are not suited to cultivation (pasture, forestry, wildlife, recreation).","w":{},"p":"practice","t":""},{"id":99,"s":"soil","q":"Organic matter is obtained from organic carbon by multiplying with:","o":["2.5","1.724","1.33","0.58"],"a":1,"e":"Organic matter is ~58% carbon, so OM = OC × 100/58 = OC × 1.724 (Van Bemmelen factor).","w":{},"p":"study","t":""},{"id":100,"s":"soil","q":"Clay particle size (USDA) is:","o":["0.002–0.05 mm","&lt;0.002 mm","&gt;2 mm","0.05–2 mm"],"a":1,"e":"USDA: clay < 0.002 mm, silt 0.002–0.05 mm, sand 0.05–2 mm, gravel > 2 mm.","w":{},"p":"practice","t":""},{"id":101,"s":"soil","q":"Which grass is a famous bioengineering species with deep vertical roots?","o":["<i>Cynodon dactylon</i>","Vetiver (<i>Chrysopogon zizanioides</i>)","<i>Imperata cylindrica</i>","<i>Eragrostis</i>"],"a":1,"e":"Vetiver (Chrysopogon zizanioides) has a dense vertical root system 2–3 m deep and is widely used for slope stabilisation and contour hedges.","w":{},"p":"practice","t":""},{"id":102,"s":"soil","q":"Available phosphorus in acidic soils is estimated by:","o":["Walkley &amp; Black","Olsen method","Bray method","Kjeldahl"],"a":2,"e":"Bray & Kurtz (acid fluoride extract) is used for acidic soils; Olsen (sodium bicarbonate, pH 8.5) for neutral–alkaline soils.","w":{},"p":"practice","t":""},{"id":103,"s":"soil","q":"Porosity of a soil with bulk density 1.325 and particle density 2.65 g/cm³ is:","o":["25%","40%","60%","50%"],"a":3,"e":"(1 − 1.325/2.65) × 100 = 50%.","w":{},"p":"study","t":""},{"id":104,"s":"soil","q":"Department of Forests and Soil Conservation was formed in:","o":["2021","2004","2012","2018"],"a":3,"e":"In 2018 the Department of Forests and the Department of Soil Conservation and Watershed Management merged into DoFSC under the federal restructuring.","w":{},"p":"study","t":""},{"id":105,"s":"soil","q":"Gabion check dams are made of:","o":["Earth only","Brushwood","Wire-mesh boxes filled with stones","Masonry with cement"],"a":2,"e":"Gabions are galvanised wire-mesh boxes filled with stones – flexible, permeable and built with local material.","w":{},"p":"study","t":""},{"id":106,"s":"soil","q":"The Chure range covers roughly what share of Nepal's area?","o":["12.8%","40%","5%","23%"],"a":0,"e":"The Chure/Siwalik covers about 12.8% of Nepal across 36–37 districts; its loose sediments erode easily and it is a groundwater recharge zone for the Terai.","w":{},"p":"practice","t":""},{"id":107,"s":"ws","q":"Discharge of a stream with cross-section 4 m² and mean velocity 0.5 m/s is:","o":["2 m³/s","0.125 m³/s","4.5 m³/s","8 m³/s"],"a":0,"e":"Q = A × V = 4 × 0.5 = 2 m³/s.","w":{},"p":"practice","t":""},{"id":108,"s":"ws","q":"By rational formula, C = 0.5, I = 50 mm/h, A = 36 ha. Peak runoff =","o":["0.25 m³/s","2.5 m³/s","25 m³/s","250 m³/s"],"a":1,"e":"Q = CIA/360 = 0.5 × 50 × 36/360 = 2.5 m³/s.","w":{},"p":"study","t":""},{"id":109,"s":"ws","q":"Nepal's first major watershed management project was in:","o":["Kulekhani","Phewa Tal","Bagmati","Tinau"],"a":1,"e":"The Phewa Tal watershed project started in 1974 (FAO/UNDP) to reduce siltation of Phewa lake, Pokhara.","w":{},"p":"practice","t":""},{"id":110,"s":"ws","q":"Where was an early warning system for GLOF installed in 1998?","o":["Dig Tsho","Tsho Rolpa","Thulagi","Imja"],"a":1,"e":"Tsho Rolpa (Rolwaling, Dolakha) got a GLOF early-warning system in 1998, and its level was lowered by 3 m through an open channel in 2000.","w":{},"p":"study","t":""},{"id":111,"s":"ws","q":"In the float method, mean velocity is approximately:","o":["0.85 × surface velocity","Equal to surface velocity","0.5 × surface velocity","1.2 × surface velocity"],"a":0,"e":"Surface velocity is faster than average; mean velocity ≈ 0.85 × surface velocity (0.8–0.9).","w":{},"p":"practice","t":""},{"id":112,"s":"ws","q":"A forested watershed, compared to a bare one, has a hydrograph with:","o":["No recession limb","Same peak","Higher and earlier peak","Lower and delayed peak"],"a":3,"e":"Forests intercept rain and increase infiltration, so the hydrograph peak is lower and later, with more sustained base flow.","w":{},"p":"study","t":""},{"id":113,"s":"ws","q":"BOD of water indicates:","o":["Turbidity","Salinity","Organic pollution","Hardness"],"a":2,"e":"Biochemical Oxygen Demand is the oxygen microbes use to decompose organic matter in 5 days at 20 °C; high BOD = organic pollution.","w":{},"p":"study","t":""},{"id":114,"s":"ws","q":"The smallest unit in the watershed hierarchy is:","o":["Sub-watershed","Sub-basin","River basin","Micro-watershed"],"a":3,"e":"River basin > sub-basin > watershed > sub-watershed > micro-watershed (the planning unit for village-level work).","w":{},"p":"study","t":""},{"id":115,"s":"ws","q":"A V-notch weir is suitable for measuring:","o":["Groundwater","Rainfall","Small stream discharge","Large river floods"],"a":2,"e":"A V-notch gives precise readings at low flows, so it suits small streams and experimental catchments.","w":{},"p":"practice","t":""},{"id":116,"s":"ws","q":"Which is a conservation-farming practice?","o":["Up-and-down slope ploughing","Minimum tillage with mulching","Monocropping","Burning residues"],"a":1,"e":"Conservation agriculture = minimum soil disturbance, permanent cover (mulch/residues) and crop rotation.","w":{},"p":"practice","t":""},{"id":117,"s":"wl","q":"The first national park of Nepal is:","o":["Rara","Langtang","Sagarmatha","Chitwan"],"a":3,"e":"Chitwan National Park was established in 1973 (2030 BS) and inscribed as a World Heritage Site in 1984.","w":{},"p":"practice","t":""},{"id":118,"s":"wl","q":"Nepal's latest (2026) national tiger estimate is:","o":["429","235","355","500"],"a":0,"e":"National Tiger &amp; Prey Base Survey 2026.","w":{},"p":"practice","t":""},{"id":119,"s":"wl","q":"Which park recorded the most tigers in 2026?","o":["Bardiya","Parsa","Banke","Chitwan"],"a":3,"e":"2026 survey: Chitwan 145, Bardiya 112, Parsa 71, Banke 51, Shuklaphanta 50 – total 429.","w":{},"p":"practice","t":""},{"id":120,"s":"wl","q":"The only place in Nepal with wild water buffalo (Arna) is:","o":["Parsa","Koshi Tappu","Shuklaphanta","Bardiya"],"a":1,"e":"Koshi Tappu Wildlife Reserve (1976) was established for the last population of wild water buffalo (Arna).","w":{},"p":"study","t":""},{"id":121,"s":"wl","q":"Nepal's 13th national park (2025) is:","o":["Banke","Khaptad","Chhayanath","Gaurishankar"],"a":2,"e":"Carved out of Shey-Phoksundo in Mugu.","w":{},"p":"study","t":""},{"id":122,"s":"wl","q":"Under the NPWC Act, the share of park revenue for buffer-zone development is:","o":["100%","10–20%","30–50%","50–70%"],"a":2,"e":"The NPWC Act provides that 30–50% of park/reserve revenue goes to community development in the buffer zone.","w":{},"p":"study","t":""},{"id":123,"s":"wl","q":"Lincoln–Petersen: 40 marked, 50 caught in second sample, 10 {"id":138,"s":"util","q":"Chiuri, the 'Indian butter tree', is:","o":["<i>Diploknema butyracea</i>","<i>Madhuca indica</i>","<i>Bassia latifolia</i>","<i>Shorea robusta</i>"],"a":0,"e":"Diploknema butyracea (Sapotaceae) seeds yield fat used as ghee; important for the Chepang community.","w":{},"p":"practice","t":""},{"id":139,"s":"util","q":"Softwoods differ from hardwoods by having:","o":["Ring-porous structure","Vessels","No vessels, mainly tracheids","Higher density always"],"a":2,"e":"Softwoods (gymnosperms) consist mainly of tracheids and lack vessels; hardwoods (angiosperms) have vessels (pores).","w":{},"p":"study","t":""},{"id":140,"s":"util","q":"Which essential oil is obtained from Dhasingre?","o":["Citronella","Eucalyptol","Camphor","Wintergreen (methyl salicylate)"],"a":3,"e":"Gaultheria fragrantissima leaves yield wintergreen oil, rich in methyl salicylate (pain balms).","w":{},"p":"study","t":""},{"id":141,"s":"util","q":"The Timber Corporation of Nepal is responsible for:","o":["Harvest, processing and sale of timber &amp; fuelwood","Seed certification","NTFP export","Wildlife protection"],"a":0,"e":"TCN harvests, processes and sells timber and fuelwood from government forests through depots.","w":{},"p":"study","t":""},{"id":142,"s":"util","q":"Yarsagumba is a:","o":["Fungus parasitising moth larvae","Moss","Lichen","Orchid"],"a":0,"e":"Yarsagumba (Ophiocordyceps sinensis) is a fungus that infects ghost-moth caterpillars in alpine meadows above ~3,500 m; the dried caterpillar-fungus complex is Nepal's most valuable NTFP.","w":{},"p":"study","t":""},{"id":143,"s":"util","q":"Rittha (natural soap) is the fruit of:","o":["<i>Sapindus mukorossi</i>","<i>Terminalia chebula</i>","<i>Aegle marmelos</i>","<i>Phyllanthus emblica</i>"],"a":0,"e":"Sapindus mukorossi fruits contain saponins and are used as natural detergent.","w":{},"p":"practice","t":""},{"id":144,"s":"util","q":"Warping of timber in which the face becomes concave across the width is:","o":["Cup","Bow","Crook","Twist"],"a":0,"e":"Cup = curvature across the width; bow = along the length on the face; crook = along the edge; twist = spiral distortion.","w":{},"p":"study","t":""},{"id":145,"s":"util","q":"Triphala consists of Amala, Barro and:","o":["Harro","Kurilo","Timur","Gurjo"],"a":0,"e":"Triphala = Amala (Phyllanthus emblica) + Harro (Terminalia chebula) + Barro (Terminalia bellirica).","w":{},"p":"practice","t":""},{"id":146,"s":"util","q":"Resin tapping in Nepal is mainly done on:","o":["<i>Cedrus deodara</i>","<i>Abies spectabilis</i>","<i>Pinus wallichiana</i>","<i>Pinus roxburghii</i>"],"a":3,"e":"Chir pine (Pinus roxburghii) is tapped by the rill/cup-and-lip method; resin is distilled into rosin and turpentine.","w":{},"p":"practice","t":""},{"id":147,"s":"util","q":"Panchaule (<i>Dactylorhiza hatagirea</i>) belongs to family:","o":["Gentianaceae","Liliaceae","Lauraceae","Orchidaceae"],"a":3,"e":"Dactylorhiza hatagirea is a terrestrial orchid (Orchidaceae) of alpine meadows; its tubers are a tonic and the species is protected.","w":{},"p":"study","t":""},{"id":148,"s":"silv","q":"Sal seedlings typically show repeated die-back of shoots before establishing because of:","o":["Excess nitrogen","Root suckering","Frost, drought, weeds and poor light","Salinity"],"a":2,"e":"Sal seedlings die back for several years (frost, drought, weed competition, shade) and resprout from a growing root stock until conditions allow them to shoot up.","w":{"0":"Sal sites are not nitrogen-saturated; N excess is not a cause.","1":"Root suckering is a regeneration method of Sissoo, not a cause of die-back."},"p":"study","t":""},{"id":149,"s":"silv","q":"Which silvicultural system keeps a continuous forest cover with trees of all ages mixed on every unit area?","o":["Selection system","Clear felling","Uniform shelterwood","Simple coppice"],"a":0,"e":"The selection system maintains an uneven-aged, all-aged forest and is preferred for steep protection forests.","w":{"1":"Clear felling removes the whole crop at once.","2":"Uniform shelterwood produces an even-aged crop.","3":"Coppice produces even-aged shoot crops on short rotations."},"p":"study","t":""},{"id":150,"s":"silv","q":"Coppice with standards produces:","o":["A coppice underwood plus scattered standards grown on longer rotation","Only pollards","Clear-felled even-aged high forest","Only seedling trees"],"a":0,"e":"Standards (often of seed origin) are retained over several coppice rotations to give timber, while the underwood gives fuel.","w":{},"p":"study","t":""},{"id":151,"s":"silv","q":"In the uniform shelterwood system, the felling that opens the canopy to induce seed production and germination is the:","o":["Preparatory felling","Seeding (regeneration) felling","Final felling","Secondary felling"],"a":1,"e":"Preparatory fellings prepare trees and soil; the seeding felling opens the canopy for seed fall; secondary fellings gradually free the regeneration; the final felling removes the last overwood.","w":{},"p":"study","t":""},{"id":152,"s":"silv","q":"Which of the following is a shade-bearing (tolerant) species?","o":["Abies spectabilis","Dalbergia sissoo","Shorea robusta","Pinus roxburghii"],"a":0,"e":"Silver fir regenerates under shade; Sal, chir pine and Sissoo are light demanders.","w":{},"p":"practice","t":""},{"id":153,"s":"silv","q":"Natural regeneration of Dalbergia sissoo on riverbeds is mainly from:","o":["Seed only","Pollard shoots","Layering","Root suckers and seed"],"a":3,"e":"Sissoo seeds colonise fresh alluvium, and the species also spreads strongly by root suckers.","w":{},"p":"practice","t":""},{"id":154,"s":"silv","q":"Containerised (polybag) seedlings are preferred over bare-root stock because they:","o":["Are cheaper to transport","Need no hardening","Grow without water","Suffer less transplanting shock, especially on dry sites"],"a":3,"e":"The intact root plug reduces shock; polybag seedlings still need hardening-off before planting.","w":{},"p":"study","t":""},{"id":155,"s":"silv","q":"Hardening-off of nursery seedlings involves:","o":["Applying more nitrogen","Gradually reducing water and shade before planting out","Pruning all leaves","Increasing water and shade"],"a":1,"e":"Hardening acclimatises seedlings to field conditions.","w":{},"p":"study","t":""},{"id":156,"s":"silv","q":"A light-demanding species regenerates best:","o":["Under a dense canopy","Only by coppice","In canopy gaps or open areas","Only in nurseries"],"a":2,"e":"Light demanders need open conditions; hence Sal needs canopy opening.","w":{},"p":"study","t":""},{"id":157,"s":"silv","q":"Seeds of temperate species such as walnut often need which pre-treatment?","o":["Hot water","Acid digestion","Sun drying","Cold moist stratification"],"a":3,"e":"Cold stratification breaks physiological (embryo) dormancy.","w":{},"p":"study","t":""},{"id":158,"s":"silv","q":"The ratio of seedlings produced to seeds sown in a nursery is the:","o":["Germination energy","Purity percentage","Viability index","Plant percent"],"a":3,"e":"Plant percent includes losses after germination.","w":{},"p":"study","t":""},{"id":159,"s":"silv","q":"Teak fruits are pretreated by alternate wetting and drying because:","o":["They contain juglone","The thick mesocarp delays germination","They are too small","They are recalcitrant"],"a":1,"e":"Alternate soaking and drying cracks the thick, corky mesocarp.","w":{},"p":"study","t":""},{"id":160,"s":"silv","q":"Rotation based on the size of material needed for a specific use (e.g. poles) is the:","o":["Physical rotation","Financial rotation","Technical rotation","Silvicultural rotation"],"a":2,"e":"Technical rotation is fixed by the dimensions required by the market or industry.","w":{},"p":"study","t":""},{"id":161,"s":"silv","q":"Financial rotation is the age at which:","o":["Seed production starts","Net discounted revenue (land expectation value) is maximum","Volume is maximum","Trees die naturally"],"a":1,"e":"It maximises soil/land expectation value using a discount rate.","w":{},"p":"study","t":""},{"id":162,"s":"silv","q":"Physical rotation corresponds to:","o":["The natural lifespan or the age at which a species can still regenerate by coppice","The felling cycle","Maximum profit","Maximum MAI"],"a":0,"e":"Physical rotation is tied to the physical life of the species or its regenerative capacity.","w":{},"p":"study","t":""},{"id":163,"s":"silv","q":"Which trait is most strongly under genetic control and responds best to selection in trees?","o":["Survival","Height on poor sites","Stem straightness","Diameter growth"],"a":2,"e":"Form traits like straightness usually have higher heritability than growth traits.","w":{},"p":"practice","t":""},{"id":164,"s":"silv","q":"The vegetation zone 1,000–2,000 m in central Nepal with Schima–Castanopsis forest is the:","o":["Temperate","Subalpine","Tropical","Subtropical"],"a":3,"e":"Schima–Castanopsis and chir pine dominate the subtropical belt.","w":{},"p":"practice","t":""},{"id":165,"s":"silv","q":"Which forest type covers the largest area in the Terai and Churia of Nepal?","o":["Oak forest","Fir forest","Sal forest","Chir pine forest"],"a":2,"e":"Sal (with associates) dominates lowland forests.","w":{},"p":"study","t":""},{"id":166,"s":"silv","q":"The tree line in Nepal is generally found at about:","o":["5,000 m","3,800–4,200 m","3,000 m","2,500 m"],"a":1,"e":"Birch, fir and rhododendron mark the tree line around 3,800–4,200 m.","w":{},"p":"study","t":""},{"id":167,"s":"silv","q":"Planting density at 2 m × 2 m spacing is:","o":["1,111 plants/ha","2,500 plants/ha","1,600 plants/ha","4,000 plants/ha"],"a":1,"e":"10,000 m² ÷ (2 × 2 m²) = 2,500 plants per hectare.","w":{"2":"1,600/ha corresponds to 2.5 m × 2.5 m.","0":"1,111/ha corresponds to 3 m × 3 m."},"p":"practice","t":""},{"id":168,"s":"silv","q":"Planting density at 3 m × 3 m spacing is about:","o":["2,500 plants/ha","833 plants/ha","1,600 plants/ha","1,111 plants/ha"],"a":3,"e":"10,000 ÷ 9 ≈ 1,111 plants/ha.","w":{},"p":"practice","t":""},{"id":169,"s":"silv","q":"Which of these regenerates readily from stem cuttings?","o":["Salix","Quercus","Shorea","Abies"],"a":0,"e":"Willows and poplars root easily from cuttings.","w":{},"p":"study","t":""},{"id":170,"s":"silv","q":"Assisted natural regeneration (ANR) means:","o":["Protecting and tending existing natural seedlings and rootstocks to speed recovery","Aerial seeding only","Clear felling and replanting","Planting exotics"],"a":0,"e":"ANR builds on what is already on the site at lower cost than planting.","w":{},"p":"practice","t":""},{"id":171,"s":"silv","q":"Which is a correct pair of family and species?","o":["Pinaceae – Taxus wallichiana","Dipterocarpaceae – Shorea robusta","Fabaceae – Schima wallichii","Meliaceae – Alnus nepalensis"],"a":1,"e":"Taxus is Taxaceae, Schima is Theaceae, Alnus is Betulaceae.","w":{},"p":"study","t":""},{"id":172,"s":"fm","q":"The main objective of yield regulation is to:","o":["Increase grazing","Maximise one-year income","Stop all harvesting","Balance harvest with growth to give sustained yield"],"a":3,"e":"Yield regulation fixes how much can be cut each year without depleting the growing stock.","w":{},"p":"practice","t":""},{"id":173,"s":"fm","q":"The area method of yield regulation is best suited to:","o":["Uneven-aged selection forests","Grasslands","Even-aged forests such as coppice and plantations","Protected areas"],"a":2,"e":"Annual coupe = total area ÷ rotation works where age classes can be laid out by area.","w":{},"p":"study","t":""},{"id":174,"s":"fm","q":"Von Mantel's formula assumes that the growing stock of a normal forest is represented by:","o":["A triangle","An exponential curve","A circle","A rectangle"],"a":0,"e":"Normal growing stock = ½ × R × yield, i.e., the area of a triangle; hence Y = 2V/R.","w":{},"p":"study","t":""},{"id":175,"s":"fm","q":"In the Austrian formula, if the actual growing stock exceeds the normal growing stock, the yield will be:","o":["Less than increment","Zero","Equal to increment","More than increment"],"a":3,"e":"(Ga − Gn)/a is positive, so the surplus is removed over the adjustment period.","w":{},"p":"study","t":""},{"id":176,"s":"fm","q":"A management plan for a government-managed forest in Nepal is usually prepared for:","o":["10 years","50 years","5 years","1 year"],"a":0,"e":"Forest management plans are typically 10-year plans.","w":{},"p":"study","t":""},{"id":177,"s":"fm","q":"Which plan does a community forest user group need for harvesting?","o":["Operational plan approved for the community forest","EIA report","Constitution only","District transport plan"],"a":0,"e":"Harvest must follow the OP.","w":{},"p":"study","t":""},{"id":178,"s":"fm","q":"Shrubland in Nepal's forest statistics is classed as:","o":["Other wooded land (OWL)","Forest","Grassland only","Agricultural land"],"a":0,"e":"FRA reports forest and OWL (shrub) separately.","w":{},"p":"study","t":""},{"id":179,"s":"fm","q":"Timber Stand Improvement does NOT include:","o":["Removing malformed trees","Final harvesting at rotation","Girdling undesirable stems","Climber cutting"],"a":1,"e":"TSI is an intermediate operation; final harvest is regeneration felling.","w":{},"p":"practice","t":""},{"id":180,"s":"fm","q":"The basic unit of a community forest OP for prescriptions and harvesting is the:","o":["Ward","Block","Range post","Working circle"],"a":1,"e":"CFs are divided into blocks with block-wise prescriptions.","w":{},"p":"study","t":""},{"id":181,"s":"fm","q":"Under-utilisation of community forests (keeping them only protected) is considered a problem because:","o":["It causes landslides","It increases elite capture","It increases tax","It reduces potential income and timber supply and leads to dense, stagnating stands"],"a":3,"e":"Passive protection forgoes products and benefits; active management is encouraged.","w":{},"p":"study","t":""},{"id":182,"s":"fm","q":"Which is a criterion of sustainable forest mana alty and handover of Terai forests.","w":{},"p":"practice","t":""},{"id":374,"s":"cf","q":"The forest that a temple, monastery or religious institution manages is a:","o":["Private forest","Religious forest","Leasehold forest","Protected forest"],"a":1,"e":"A religious forest is handed to a religious body for conservation.","w":{},"p":"practice","t":""},{"id":375,"s":"cf","q":"A protected forest under the Forest Act is declared for:","o":["Timber sale","Housing","Special environmental, scientific or cultural importance","Private farming"],"a":2,"e":"The government may declare protected forests for environmental, scientific or cultural importance.","w":{},"p":"practice","t":""},{"id":376,"s":"cf","q":"Which agency provides technical support for preparing CF operational plans?","o":["Election Commission","DHM","Nepal Rastra Bank","Division Forest Office"],"a":3,"e":"The Division Forest Office (with sub-division/range posts) provides technical support and approves OPs.","w":{},"p":"practice","t":""},{"id":377,"s":"cf","q":"Key informant interviews are held with:","o":["Randomly chosen tourists only","Knowledgeable individuals such as elders, teachers or leaders","Children","Only government staff"],"a":1,"e":"KIIs collect in-depth information from people with special knowledge.","w":{},"p":"study","t":""},{"id":378,"s":"cf","q":"Focus group discussion typically involves:","o":["Only officials","An entire village of 500","6–12 people with shared characteristics discussing a topic","One person"],"a":2,"e":"A focus group of about 6–12 similar people (e.g. women, Dalits) discusses guided questions.","w":{},"p":"study","t":""},{"id":379,"s":"cf","q":"An inclusive CFUG executive committee ensures representation of:","o":["Only founders","Only rich households","Only men","Women, Dalits, Janajatis and poor households"],"a":3,"e":"Inclusive committees reflect women, Dalits, Janajatis, Madhesi and poor households.","w":{},"p":"practice","t":""},{"id":380,"s":"cf","q":"Which docum
