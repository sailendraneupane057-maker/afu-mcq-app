2,579,1033,89,779,1032,787,854,810,783,771,790],[922,898,157,880,416,1,149,443,913,507,1057,184,1053,1078,1079,389,1063,23,27,1075,30,190,199,928,1119,466,47,462,208,1138,557,517,516,532,231,252,244,871,867,63,378,735,366,68,74,1153,1145,1143,795,95,798,803,407,97,268,145,501,324,707,693,329,330,144,135,494,1161,294,861,293,1170,614,970,118,620,131,1189,603,932,124,318,334,83,349,345,873,1044,806,75,1031,1003],[434,902,421,474,150,1102,425,410,447,427,1084,901,1070,187,1064,1068,22,1087,29,904,196,931,192,1112,195,884,210,45,465,1133,549,537,544,858,561,234,260,256,986,248,376,820,245,361,238,794,952,265,953,801,1149,399,859,1155,1151,975,719,479,328,325,490,487,977,143,729,1176,109,948,943,1162,827,1195,675,639,308,591,816,586,834,315,76,1034,1024,1039,337,776,1017,88,1050,1048]]};window.__N={"silv":"\n<h3>1. Forest types of Nepal</h3>\n<ul>\n<li><b>Stainton (1972)</b> described <b>35 forest types</b>; the Biodiversity Profile Project (BPP, 1995) recognised <b>118 ecosystems</b> (80 of them lie inside protected areas).</li>\n<li>FRA Nepal (2010–14) reported forests by physiographic region: Terai, Churia (Siwalik), Middle Mountains, High Mountains &amp; High Himal. The Middle Mountains hold the largest forest area; the Terai the lowest share of forest cover.</li>\n</ul>\n<table>\n<tr><th>Zone (approx. altitude)</th><th>Key forest types / species</th></tr>\n<tr><td>Tropical (&lt;1,000 m)</td><td>Sal (<i>Shorea robusta</i>) forest; Khair–Sissoo riverine forest; Terai mixed hardwood (Asna/Saj <i>Terminalia</i>, Karma <i>Haldina cordifolia</i>, Simal <i>Bombax ceiba</i>)</td></tr>\n<tr><td>Subtropical (1,000–2,000 m)</td><td>Chilaune–Katus (<i>Schima wallichii–Castanopsis indica</i>); Chir pine (<i>Pinus roxburghii</i>); Utis (<i>Alnus nepalensis</i>) on moist/disturbed slopes</td></tr>\n<tr><td>Lower temperate (2,000–2,700 m)</td><td>Oaks (<i>Quercus leucotrichophora, Q. lanata, Q. glauca</i>); Blue pine (<i>Pinus wallichiana</i>); <i>Castanopsis tribuloides</i>; Lauraceae forest</td></tr>\n<tr><td>Upper temperate (2,700–3,100 m)</td><td>Kharsu oak (<i>Q. semecarpifolia</i>), Hemlock (<i>Tsuga dumosa</i>), Spruce (<i>Picea smithiana</i>), Deodar (<i>Cedrus deodara</i>, west only)</td></tr>\n<tr><td>Subalpine (3,000–4,100 m)</td><td>Silver fir (<i>Abies spectabilis</i>), Birch (<i>Betula utilis</i>, Bhojpatra), <i>Rhododendron campanulatum</i>, Larch (<i>Larix</i>)</td></tr>\n<tr><td>Alpine (&gt;4,100 m)</td><td>Scrub of <i>Juniperus</i>, <i>Rhododendron anthopogon</i>, <i>R. lepidotum</i>; alpine meadows</td></tr>\n</table>\n<p>Tree line in Nepal is roughly 3,800–4,200 m (higher in the drier west/north). Sal reaches ~1,500 m in the river valleys.</p>\n\n<h3>2. Forest ecosystem, normal forest, locality factors</h3>\n<ul>\n<li><b>Locality (site) factors</b>: climatic (light, temperature, rainfall, humidity, wind), edaphic (soil), topographic/physiographic (altitude, aspect, slope), biotic (man, animals, plants). Together they decide the <b>site quality</b>, measured by <b>site index</b> (top height at a base age).</li>\n<li><b>Normal forest</b>: an ideal standard for sustained yield, with (i) <b>normal age-class distribution</b> (equal area in every age class from 1 to R), (ii) <b>normal increment</b>, and (iii) <b>normal growing stock</b>. Real forests are compared with it to regulate yield.</li>\n<li>South-facing slopes in Nepal are warmer/drier (chir pine, grass, fire). North-facing slopes are cool and moist (oak, fir, richer regeneration).</li>\n</ul>\n\n<h3>3. Silvicultural systems</h3>\n<table>\n<tr><th>System</th><th>Essence</th><th>Use in Nepal</th></tr>\n<tr><td>Clear felling</td><td>Whole crop removed at once; regeneration artificial (or natural from adjoining stands)</td><td>Plantations (Eucalyptus, Sissoo, Teak)</td></tr>\n<tr><td>Seed tree</td><td>Few seed bearers (≈10–25/ha) left for natural seeding</td><td>Pine</td></tr>\n<tr><td>Shelterwood (uniform, group, irregular)</td><td>Gradual removal in <b>preparatory → seeding → secondary → final</b> fellings; new crop grows under shelter</td><td>Sal under Scientific Forest Management (irregular shelterwood) in Terai CFs, started 2071/72 BS and later suspended</td></tr>\n<tr><td>Selection (single tree / group)</td><td>Uneven-aged, all ages mixed on every unit area; continuous cover</td><td>Hill CFs; protection forests on steep slopes</td></tr>\n<tr><td>Coppice (simple, with standards, two rotations, pollarding)</td><td>Regeneration from stool shoots; short rotation</td><td>Fuelwood/fodder: Sal, Sissoo, Khair, Eucalyptus, Utis (poor), Salix</td></tr>\n</table>\n<p><b>Pollarding</b> = cutting at 2–3 m height (out of reach of cattle). <b>Lopping</b> = cutting branches for fodder. Conifers (except a few) do not coppice.</p>\n\n<h3>4. Silviculture for different forest categories (Forest Act 2049 / 2076)</h3>\n<ul>\n<li><b>Forest Act 2049 (1993)</b> national forest categories: Government-managed, Protected, Community, Leasehold, Religious. <b>Forest Act 2076 (2019)</b> adds <b>Collaborative forest</b> as a category (Govt-managed, Protected, Community, Collaborative, Leasehold, Religious). Private forests are outside national forest.</li>\n<li><b>Community forest</b>: multiple products (fuel, fodder, timber, NTFP); selection/group selection or shelterwood; thinning, singling of coppice, climber cutting.</li>\n<li><b>Leasehold forest</b>: degraded land leased to poor groups (forage, fodder trees, NTFP, Amriso); lease up to 40 years, renewable.</li>\n<li><b>Religious forest</b>: conservation focus, minimum intervention.</li>\n<li><b>Plantation forest</b>: site preparation → planting (pit 30×30×30 cm or 45×45×45 cm typical) → weeding → cleaning → thinning → final harvest.</li>\n<li><b>Natural forest</b>: rely on natural regeneration; assisted natural regeneration (ANR).</li>\n</ul>\n\n<h3>5. Seed technology</h3>\n<ul>\n<li><b>Orthodox seeds</b> tolerate drying (to 5–10% moisture) and cold storage: Pine, Acacia, Eucalyptus, Sissoo, Teak, Khair.</li>\n<li><b>Recalcitrant seeds</b> die if dried; short viability: <b>Sal</b> (≈1 week), Neem, Jamun (<i>Syzygium</i>), Mango, Litchi, Jackfruit, Oaks, Chestnut. Sow fresh.</li>\n<li><b>Dormancy treatments</b>: hot-water soaking / mechanical scarification (hard coat: Acacia, Khair, Albizia), acid scarification (conc. H₂SO₄), cold moist <b>stratification</b> (temperate species e.g. walnut, some conifers), alternate wetting–drying (Teak).</li>\n<li><b>Testing</b> follows ISTA rules: purity, moisture, germination %, 1,000-seed weight, viability by <b>tetrazolium (TTC) test</b> (live tissue stains red), cutting test.</li>\n<li><b>Germination capacity</b> = % of seeds that germinate in the test; <b>germination energy</b> = % germinated within the peak period (speed); <b>plant percent</b> = % that become usable seedlings.</li>\n<li>Seed sources (lowest to highest genetic quality): seed collection area → seed production area (SPA) → seedling seed orchard (SSO) → clonal seed orchard (CSO). Certification: source-identified → selected → qualified → tested.</li>\n</ul>\n\n<h3>6. Regeneration, tending, rotation</h3>\n<ul>\n<li><b>Natural regeneration</b>: from seed, coppice, root suckers (Sissoo, Populus, Ailanthus). <b>Artificial</b>: direct sowing, seedlings (bare-root / containerised in polybags), stumps (Teak, Gmelina, Sissoo, Toona), cuttings (Salix, Populus, Bamboo, Ficus), grafting/budding, tissue culture.</li>\n<li><b>Tending sequence</b>: weeding → cleaning (removing unwanted woody growth in sapling stage) → climber cutting → thinning → pruning. <b>Singling</b> = reducing coppice shoots to one.</li>\n<li><b>Thinning</b>: low (ordinary) thinning removes suppressed/dominated trees; crown thinning removes competitors in the canopy; mechanical thinning by spacing; free thinning; selection thinning removes dominants. Grades A (very light) → D (heavy), E = crown thinning.</li>\n<li><b>Rotation</b>: physical, silvicultural, technical (size needed), <b>rotation of maximum volume production (when CAI = MAI, i.e. MAI is at its peak)</b>, financial (max. soil expectation value), maximum income.</li>\n<li><b>Light demanders</b>: Sal, Teak, Khair, Sissoo, Chir pine, Eucalyptus, Simal. <b>Shade bearers</b>: Fir, Hemlock, Yew (<i>Taxus</i>), many oaks/Lauraceae, Michelia (moderate).</li>\n</ul>\n\n<h3>7. Tree improvement</h3>\n<ul>\n<li>Steps: species trial → provenance trial → plus-tree selection → progeny test → seed orchard → breeding (hybrids e.g. Eucalyptus).</li>\n<li><b>Genetic gain</b> ΔG = h² × S (h² = heritability; S = selection differential = mean of selected − population mean).</li>\n<li>Broad-sense heritability H² = V<sub>G</sub>/V<sub>P</sub>; narrow-sense h² = V<sub>A</sub>/V<sub>P</sub>. Phenotype = Genotype + Environment.</li>\n<li>Provenance = geographic source of seed; progeny test = evaluation of parents by their offspring.</li>\n</ul>\n\n<h3>8. Commercial species — quick profiles</h3>\n<table>\n<tr><th>Species</th><th>Family</th><th>Key silvics / facts</th></tr>\n<tr><td>Sal <i>Shorea robusta</i></td><td>Dipterocarpaceae</td><td>Gregarious, light demander, frost- and drought-sensitive seedling, die-back of shoots (ups and downs before establishing), coppices well, seeds May–June, recalcitrant. Pests: heartwood borer <i>Hoplocerambyx spinicornis</i>; heart rot <i>Phellinus</i> (Fomes) <i>caryophylli</i>. Resin = <i>Rani dhup</i>.</td></tr>\n<tr><td>Sissoo <i>Dalbergia sissoo</i></td><td>Fabaceae</td><td>Riverine pioneer on new alluvium, N-fixing, root suckers; die-back/wilt (<i>Fusarium solani</i>) caused heavy mortality in Terai.</td></tr>\n<tr><td>Khair <i>Acacia (Senegalia) catechu</i></td><td>Fabaceae</td><td>Riverine with Sissoo; heartwood gives <b>katha</b> (catechin) and <b>cutch</b> (tannin). Hard seed – hot water.</td></tr>\n<tr><td>Teak <i>Tectona grandis</i></td><td>Lamiaceae</td><td>Exotic in Nepal, ring porous, defoliator <i>Hyblaea puera</i>, skeletonizer <i>Eutectona machaeralis</i>; stump planting; fruit has thick mesocarp – alternate wetting/drying.</td></tr>\n<tr><td>Chir pine <i>Pinus roxburghii</i></td><td>Pinaceae</td><td>Thick fire-resistant bark, fire-hardy; resin tapping (rill method); dry south slopes 1,000–2,000 m. Planted on degraded hills.</td></tr>\n<tr><td>Blue pine <i>Pinus wallichiana</i></td><td>Pinaceae</td><td>5 needles/fascicle (chir has 3); temperate; aggressive coloniser.</td></tr>\n<tr><td>Utis <i>Alnus nepalensis</i></td><td>Betulaceae</td><td>N-fixing via <i>Frankia</i>; pioneer on landslides; fast growing; used in cardamom agroforestry.</td></tr>\n<tr><td>Chilaune <i>Schima wallichii</i></td><td>Theaceae</td><td>Fire-hardy, coppices; mid-hills; bark irritant.</td></tr>\n<tr><td>Tooni <i>Toona ciliata</i></td><td>Meliaceae</td><td>Shoot borer <i>Hypsipyla robusta</i>; good furniture wood.</td></tr>\n<tr><td>Chanp <i>Michelia champaca</i></td><td>Magnoliaceae</td><td>Valuable timber of eastern hills.</td></tr>\n<tr><td>Lauth salla <i>Taxus wallichiana</i></td><td>Taxaceae</td><td>Source of <b>taxol (paclitaxel)</b>, anti-cancer; shade bearer; CITES App. II.</td></tr>\n<tr><td>Eucalyptus <i>E. camaldulensis</i></td><td>Myrtaceae</td><td>Fast, coppices; allelopathy debate; pink disease (<i>Corticium salmonicolor</i>).</td></tr>\n</table>\n<div class=\"box\"><b>Remember:</b> Chir pine – 3 needles; Blue pine – 5 needles. Sal seed – recalcitrant. Utis – <i>Frankia</i> (actinomycete); legumes – <i>Rhizobium</i>. CAI = MAI → rotation of maximum volume.</div>\n","fm":"\n<h3>1. Common terms</h3>\n<ul>\n<li><b>Sustained yield</b>: continuous, even flow of products without impairing productivity. <b>Sustainable forest management (SFM)</b> extends this to ecological, social and economic values (criteria &amp; indicators – Montreal/Helsinki processes; ITTO).</li>\n<li><b>Growing stock</b> = total volume of trees in a forest. <b>Increment</b>: CAI (current annual), PAI (periodic annual = increment over a period ÷ years), MAI (mean annual = total volume ÷ age).</li>\n<li><b>Allowable cut / Annual allowable cut (AAC)</b>: volume/area that can be harvested each year under sustained yield. <b>Felling cycle</b>: interval between successive fellings in the same area (selection/irregular forests). <b>Rotation</b>: planned number of years between formation and final felling of a crop.</li>\n<li><b>Working plan</b> (management plan) units: working circle → felling series → compartment/block → sub-compartment. In community forests the OP divides the forest into <b>blocks</b> (and sub-blocks).</li>\n</ul>\n\n<h3>2. Yield regulation formulas (must know)</h3>\n<table>\n<tr><th>Method</th><th>Formula</th><th>Notes</th></tr>\n<tr><td>Area method</td><td>Annual coupe = A / R</td><td>Simple, for even-aged/coppice</td></tr>\n<tr><td>Von Mantel (Masson's)</td><td>Y = 2V / R &nbsp; (= V ÷ R/2)</td><td>V = actual growing stock. Assumes normal triangle of growing stock</td></tr>\n<tr><td>Austrian (Karl's) formula</td><td>Y = I + (Ga − Gn) / a</td><td>I = increment, Ga actual, Gn normal GS, a = adjustment period</td></tr>\n<tr><td>Hundeshagen</td><td>Y = Ga × (Yn / Gn)</td><td>Ratio of normal yield to normal GS applied to actual GS</td></tr>\n<tr><td>Normal growing stock</td><td>Gn = (R × I) / 2</td><td>I = total annual increment of normal forest</td></tr>\n<tr><td>Diameter-class / selection</td><td>Cut by diameter limit &amp; felling cycle</td><td>Brandis/ Indian method for uneven-aged</td></tr>\n</table>\n<p>MAI = total volume ÷ age. Example: 300 m³/ha at 50 years → MAI = 6 m³/ha/yr.</p>\n\n<h3>3. Management of natural and man-made forests</h3>\n<ul>\n<li>Natural forest: protect regeneration, control grazing/fire, select appropriate system, harvest within increment.</li>\n<li>Plantation: species–site matching, spacing (e.g. 2×2 m, 2.5×2.5 m), weeding for first 2–3 years, beating-up (replacing failures), thinning schedule, final felling.</li>\n<li><b>Timber Stand Improvement (TSI)</b>: removing defective, diseased, over-mature and undesirable trees, climber cutting and liberation felling to favour crop trees.</li>\n<li><b>Shrubland management</b>: enrichment planting, protection for natural recovery, coppice management, fodder/NTFP promotion, conversion to productive forest.</li>\n</ul>\n\n<h3>4. Operational plan (OP) and management plan</h3>\n<ul>\n<li>Community forest OP contents: forest description &amp; maps, block division, inventory results (growing stock, increment, regeneration), objectives, silvicultural prescriptions, annual allowable harvest by block, protection (fire, grazing), NTFP management, plantation, income–expenditure, benefit sharing, pro-poor provisions, monitoring.</li>\n<li>Forest Act 2076: CFUG prepares the OP with technical support of the Division Forest Office; OP is valid up to 10 years and renewed after review. Harvest must not exceed the increment prescribed in the OP.</li>\n<li>District/divisional forest management plans (10 years) for government-managed forests; Scientific Forest Management (SciFM) was piloted in Terai CFs using shelterwood with rotation ~60–80 years.</li>\n</ul>\n\n<h3>5. Second-generation issues (community &amp; leasehold forestry)</h3>\n<p>After handover (first generation = forming groups &amp; protecting forest), the issues became: <b>governance</b> (transparency, accountability, public auditing), <b>equity</b> (elite capture, benefit sharing for poor/women/Dalits), <b>livelihood</b> (income generation, enterprise), <b>sustainable/active management</b> (forests often under-utilised; \"passive protection\"), <b>tax/royalty</b> conflicts with the state, and <b>conflict</b> between users &amp; government. The 4th National CF Workshop (2004) highlighted these.</p>\n<p>Forest Act 2076 spending rule for CFUG income: at least <b>25% for forest development, management and protection</b>; of the remaining amount at least 50% for pro-poor livelihood, women empowerment and enterprise activities.</p>\n\n<h3>6. Inventory for community forests &amp; NTFPs</h3>\n<ul>\n<li>Steps: boundary survey (GPS/compass) → map &amp; area → stratification into blocks by forest type/condition → systematic or stratified random sampling → concentric circular plots → measure DBH, height, species, regeneration count → compute per-ha stems, basal area, volume (Sharma &amp; Pukkala 1990 equations), biomass/carbon, MAI → AAC.</li>\n<li>Typical concentric plot radii used in CF inventory: <b>8.92 m (250 m²)</b> trees; <b>5.64 m (100 m²)</b> poles; <b>2.82 m (25 m²)</b> saplings; ~0.56 m (1 m²) regeneration. Size classes commonly: seedling &lt;1.3 m height; sapling height ≥1.3 m &amp; DBH &lt;10 cm; pole 10–30 cm; tree &gt;30 cm DBH. <i>(Check against the current CF inventory guideline you use in OP work.)</i></li>\n<li><b>NTFP inventory</b>: transects/belt transects, quadrats (1×1 m herbs, 5×5 m shrubs), resource mapping with users, harvest-yield studies, sustainable harvest = regeneration rate.</li>\n</ul>\n<div class=\"box\"><b>Formula drill:</b> Von Mantel Y = 2V/R; Austrian Y = I + (Ga−Gn)/a; Area coupe = A/R; Gn = R·I/2; MAI = V/age.</div>\n","eco":"\n<h3>1. Ecosystem concepts</h3>\n<ul>\n<li>\"Ecology\" coined by <b>Ernst Haeckel (1869)</b>; \"Ecosystem\" by <b>A.G. Tansley (1935)</b>. Organisational hierarchy: individual → population → community → ecosystem → landscape → biome → biosphere.</li>\n<li>Components: abiotic + biotic (producers, consumers, decomposers). <b>Lindeman (1942)</b> – 10% law of energy transfer. Pyramid of energy is always upright; pyramid of biomass can be inverted (aquatic); pyramid of numbers inverted in a tree ecosystem.</li>\n<li>Laws: Liebig's law of the minimum; Shelford's law of tolerance. Ecotone = transition zone; edge effect = more species at the ecotone.</li>\n<li>Raunkiaer life forms: phanerophytes (trees/shrubs, buds high), chamaephytes, hemicryptophytes, cryptophytes (geophytes), therophytes (annuals).</li>\n</ul>\n\n<h3>2. Productivity</h3>\n<ul>\n<li><b>GPP</b> = total photosynthesis; <b>NPP = GPP − R</b> (respiration of autotrophs); <b>NEP</b> = NPP − heterotrophic respiration.</li>\n<li>Measurement: harvest method (biomass change), light-and-dark bottle (O₂) method (aquatic), CO₂ exchange / eddy covariance, chlorophyll method, radioactive tracer (¹⁴C), remote sensing (NDVI-based).</li>\n<li>Tropical rain forest has the highest NPP among terrestrial biomes; open ocean the lowest per unit area but large in total.</li>\n</ul>\n\n<h3>3. Succession</h3>\n<ul>\n<li>Primary (bare rock, new alluvium) vs secondary (after disturbance – abandoned fields, burnt forest). Stages: nudation → invasion → competition/reaction → stabilisation (climax) (Clements).</li>\n<li>Seres: hydrosere (water), xerosere – lithosere (rock), psammosere (sand), halosere (saline).</li>\n<li>Climax theories: <b>monoclimax</b> (Clements – climate), <b>polyclimax</b> (Tansley), <b>climax-pattern</b> (Whittaker).</li>\n<li><b>Retrogression</b> (retrogressive succession): community moves back to simpler stages because of overgrazing, lopping, fire, erosion – common in Nepal's degraded mid-hills (e.g. oak forest → shrubland → grassland).</li>\n<li>Riverine succession in Terai: grassland (<i>Saccharum, Imperata</i>) → Khair–Sissoo → mixed riverine → Sal (climax).</li>\n</ul>\n\n<h3>4. Phenotypic variation, plasticity, ecotypes</h3>\n<ul>\n<li><b>Phenotypic plasticity</b>: one genotype gives different phenotypes in different environments (ecophenes; non-heritable).</li>\n<li><b>Ecotype</b> (Turesson 1922): genetically distinct population adapted to local conditions (heritable). Ecocline = gradual variation along a gradient. Provenance variation in trees is ecotypic.</li>\n</ul>\n\n<h3>5. Interactions, tolerance, stand structure</h3>\n<ul>\n<li>Competition (intra- &amp; inter-specific; Gause's competitive exclusion principle), mutualism (mycorrhiza, <i>Rhizobium</i>), commensalism (epiphytic orchids), amensalism (allelopathy: <i>Juglans</i> – juglone; Eucalyptus), parasitism (mistletoe, <i>Cuscuta</i>), predation.</li>\n<li><b>Tolerance</b> = ability of a tree to grow under shade (shade tolerance) – decides stratification and succession.</li>\n<li>Stand structure: vertical (strata – emergent, canopy, understorey, shrub, ground) and horizontal (diameter distribution: even-aged → bell-shaped; uneven-aged → reverse-J / negative exponential, de Liocourt's q-ratio).</li>\n</ul>\n\n<h3>6. Diversity and richness</h3>\n<table>\n<tr><th>Measure</th><th>Formula</th></tr>\n<tr><td>Shannon–Wiener H′</td><td>H′ = −Σ p<sub>i</sub> ln p<sub>i</sub> (max = ln S)</td></tr>\n<tr><td>Simpson's index (dominance)</td><td>D = Σ p<sub>i</sub>²; diversity = 1 − D</td></tr>\n<tr><td>Pielou evenness</td><td>J = H′ / ln S</td></tr>\n<tr><td>Margalef richness</td><td>R = (S − 1)/ln N</td></tr>\n<tr><td>Menhinick richness</td><td>S/√N</td></tr>\n<tr><td>Sørensen similarity</td><td>2C/(A + B)</td></tr>\n<tr><td>Jaccard similarity</td><td>C/(A + B − C)</td></tr>\n<tr><td>Importance Value Index</td><td>IVI = relative density + relative frequency + relative dominance (max 300)</td></tr>\n</table>\n<p>α-diversity = within a site; β = turnover between sites (Whittaker β = γ/ᾱ − 1); γ = whole landscape/region.</p>\n\n<h3>7. Ecosystem services &amp; payment for ecosystem services (PES)</h3>\n<ul>\n<li>Millennium Ecosystem Assessment (2005): <b>provisioning</b> (timber, food, water), <b>regulating</b> (climate, flood, pollination), <b>cultural</b> (recreation, spiritual), <b>supporting</b> (soil formation, nutrient cycling).</li>\n<li>PES: users of a service pay providers. Nepal examples: Kulekhani watershed (hydropower revenue to upstream communities), drinking-water schemes paying upstream CFs, ecotourism fees, carbon payments (REDD+).</li>\n<li><b>REDD+</b>: Reducing Emissions from Deforestation and forest Degradation + conservation, SFM, enhancement of carbon stocks. Nepal's Emission Reductions Programme covers the Terai Arc Landscape districts under the World Bank FCPF Carbon Fund (ERPA signed 2021).</li>\n</ul>\n","af":"\n<h3>1. Definition and classification</h3>\n<ul>\n<li><b>Agroforestry</b> (Lundgren &amp; Raintree 1982, ICRAF): land-use systems where woody perennials are deliberately used on the same land unit as crops and/or animals, in spatial or temporal arrangement, with ecological and economic interactions.</li>\n<li><b>ICRAF</b> (International Council for Research in Agroforestry, now World Agroforestry, part of CIFOR-ICRAF) was set up in 1977–78, Nairobi.</li>\n<li><b>Nair (1985) classification</b>: structural (components &amp; arrangement), functional (productive/protective), socio-economic (commercial, intermediate, subsistence), ecological (agro-ecological zones).</li>\n<li>Structural classes: <b>Agrisilviculture</b> (trees + crops), <b>Silvopastoral</b> (trees + pasture/animals), <b>Agrosilvopastoral</b> (trees + crops + animals; e.g. home gardens), Others (aquaforestry/silvofishery, apiculture with trees, sericulture).</li>\n<li>Nepal approved its <b>National Agroforestry Policy in 2076 BS (2019)</b>.</li>\n</ul>\n\n<h3>2. Practices</h3>\n<table>\n<tr><th>Practice</th><th>Key point</th></tr>\n<tr><td>Taungya</td><td>Forest plantation with crops in early years; originated in Burma (1850s, Brandis)</td></tr>\n<tr><td>Alley cropping (hedgerow intercropping)</td><td>Crops between rows of pruned N-fixing hedges (<i>Leucaena, Gliricidia, Flemingia</i>)</td></tr>\n<tr><td>Home garden</td><td>Multistorey mix around homestead – most diverse system</td></tr>\n<tr><td>Boundary planting, live fences</td><td>Trees on farm edges, terrace risers (Nepal's mid-hills)</td></tr>\n<tr><td>Windbreak / shelterbelt</td><td>Protects crops; protection zone ≈ 10–20 × tree height leeward</td></tr>\n<tr><td>Improved fallow</td><td>Planting fast N-fixers during fallow</td></tr>\n<tr><td>Silvopasture, fodder banks</td><td>Fodder trees + grasses for stall feeding</td></tr>\n<tr><td>Large-cardamom + Utis</td><td>Eastern hills (Ilam, Taplejung); Utis gives shade &amp; N</td></tr>\n<tr><td>SALT</td><td>Sloping Agricultural Land Technology – contour hedgerows</td></tr>\n</table>\n\n<h3>3. Multipurpose trees (MPTs) of Nepal's farms</h3>\n<p>Fodder: Khanyu (<i>Ficus semicordata</i>), Nimaro (<i>F. auriculata</i>), Dudhilo (<i>F. nemoralis</i>), Badahar (<i>Artocarpus lakoocha</i>), Kutmiro (<i>Litsea monopetala</i>), Tanki (<i>Bauhinia purpurea</i>), Koiralo (<i>B. variegata</i>), Gogan (<i>Saurauia</i>), Ipil-ipil (<i>Leucaena leucocephala</i>), Bakaino (<i>Melia azedarach</i>), Kimbu (<i>Morus alba</i>). Grass: Amriso/broom grass (<i>Thysanolaena maxima</i>), Napier. Fruit-cum-timber: Chiuri, Mango, Jackfruit, Litchi. Timber on farms: Sissoo, Teak, Eucalyptus, Poplar, Gmelina, <i>Melia</i>.</p>\n\n<h3>4. Soil productivity, tree–crop interface</h3>\n<ul>\n<li>Trees improve soil by: N-fixation, <b>nutrient pumping</b> from deep layers, litter &amp; organic matter, reduced erosion and leaching (\"safety net\"), improved structure and microbial activity.</li>\n<li>Interface effects: competition for <b>light, water and nutrients</b>; allelopathy; microclimate (shade, lower temperature, wind reduction); pest/disease habitat. Managed by species choice, spacing, root pruning, crown pruning/pollarding, orientation (east–west rows).</li>\n<li><b>Land Equivalent Ratio</b> LER = Σ (yield in intercrop ÷ yield in sole crop); LER &gt; 1 means the mixture is advantageous.</li>\n</ul>\n\n<h3>5. Fuelwood and biomass energy</h3>\n<ul>\n<li>Traditional biomass (fuelwood, crop residue, dung) is the largest share of Nepal's energy consumption (WECS data), mostly for household cooking.</li>\n<li>Good fuelwood: high density and calorific value (~18–20 MJ/kg, 4,500–5,000 kcal/kg dry wood), low moisture and ash, burns without smoke/sparks, coppices well. Examples: Khair, Sal, Sissoo, <i>Acacia</i>, <i>Prosopis</i>, Chilaune, oaks.</li>\n<li>Fuel Value Index FVI = (calorific value × density) / (ash × moisture).</li>\n<li>Alternatives: improved cooking stoves, biogas, briquettes (e.g. from <i>Banmara</i>), charcoal.</li>\n</ul>\n\n<h3>6. Diagnosis &amp; Design (D&amp;D) and economics</h3>\n<ul>\n<li><b>D&amp;D</b> (ICRAF, Raintree 1987): pre-diagnostic → diagnostic → design &amp; evaluation → planning → implementation; iterative, farmer participation. Key questions: what is the system, how does it work, problems, what improvements.</li>\n<li>Economics: costs and benefits over time → <b>NPV</b> (&gt;0 acceptable), <b>BCR</b> (&gt;1), <b>IRR</b> (&gt; discount rate), payback period, LEV/Faustmann formula for land expectation value.</li>\n<li>Agroforestry \"3 tests\": productivity, sustainability, adoptability.</li>\n</ul>\n","prot":"\n<h3>1. Protection against environmental agents</h3>\n<ul>\n<li><b>Fire</b>: fire triangle = fuel + oxygen + heat. Types: <b>ground</b> (burns humus/peat, smouldering), <b>surface</b> (litter, grass – most common in Nepal), <b>crown</b> (canopy; conifers). Fire season in Nepal: roughly Falgun–Jestha (Feb–May), peak in Chaitra–Baishakh (March–April).</li>\n<li>Control: fire lines/breaks, controlled (prescribed) early burning, counter firing/back firing, fire watch towers, community fire crews, beaters; detection via MODIS/VIIRS (ICIMOD forest-fire alerts). Nepal Forest Fire Management Strategy 2067 BS (2010).</li>\n<li>Other agents: frost (sal, teak seedlings – frost hollows), drought, wind-throw, snow break, landslides, floods, lightning.</li>\n</ul>\n\n<h3>2. Protection against man and grazing</h3>\n<ul>\n<li>Illicit felling, encroachment, lopping, over-harvesting of NTFPs, poaching, infrastructure. Measures: patrolling, community protection, legal action under Forest Act 2076, boundary pillars, awareness.</li>\n<li>Grazing harms: browsing of regeneration, trampling/soil compaction, erosion, spreading weeds, fire risk. Remedies: rotational grazing, closure, stall feeding, fodder trees, fencing (live/cattle-proof trench), controlled grazing by carrying capacity.</li>\n</ul>\n\n<h3>3. Weeds, climbers and invasive alien species</h3>\n<p>Major invasive plants in Nepal: <b><i>Mikania micrantha</i></b> (mile-a-minute; Chitwan grasslands), <i>Chromolaena odorata</i> (Siam weed / Banmara), <i>Ageratina adenophora</i> (Kalo banmara), <i>Lantana camara</i>, <i>Parthenium hysterophorus</i>, <i>Eichhornia crassipes</i> (water hyacinth – Phewa, Begnas), <i>Ipomoea carnea</i>. Partial parasite: mistletoe (<i>Loranthus, Dendrophthoe</i>); total stem parasite: <i>Cuscuta</i> (Akashbeli).</p>\n\n<h3>4. Nursery pests and diseases</h3>\n<ul>\n<li>Pests: cutworms (<i>Agrotis</i>), white grubs (<i>Holotrichia</i>), crickets, termites (<i>Odontotermes</i>), aphids, birds/rodents. Control: soil treatment with insecticide (e.g. chlorpyrifos), clean cultivation, light traps, hand picking, neem products.</li>\n<li><b>Damping-off</b> (pre- and post-emergence) by <i>Pythium, Rhizoctonia, Fusarium, Phytophthora</i>: avoid over-watering &amp; dense sowing, sterilise soil, seed dressing with Captan/Thiram, Bordeaux mixture, good drainage, sun exposure.</li>\n</ul>\n\n<h3>5. Important forest insects</h3>\n<table>\n<tr><th>Insect</th><th>Host</th><th>Control</th></tr>\n<tr><td>Sal heartwood borer <i>Hoplocerambyx spinicornis</i> (Cerambycidae)</td><td>Sal</td><td><b>Trap-tree method</b> (fresh billets attract beetles, collect &amp; kill), removing infested trees, sanitation</td></tr>\n<tr><td>Teak defoliator <i>Hyblaea puera</i></td><td>Teak</td><td>Biological agents, Bt, insecticide in plantations</td></tr>\n<tr><td>Teak skeletonizer <i>Eutectona machaeralis</i></td><td>Teak</td><td>As above</td></tr>\n<tr><td>Toona/Mahogany shoot borer <i>Hypsipyla robusta</i></td><td>Toona, Cedrela</td><td>Mixed planting, shade, pruning infested shoots</td></tr>\n<tr><td>Sissoo defoliator <i>Plecoptera reflexa</i></td><td>Sissoo</td><td>Insecticide/biocontrol</td></tr>\n<tr><td>Termites</td><td>Eucalyptus, many seedlings</td><td>Soil treatment, removing mounds</td></tr>\n<tr><td>Bark beetles (Scolytinae)</td><td>Conifers</td><td>Sanitation felling</td></tr>\n</table>\n\n<h3>6. Tree diseases</h3>\n<table>\n<tr><th>Disease / pathogen</th><th>Host</th></tr>\n<tr><td>Sissoo die-back / wilt – <i>Fusarium solani</i> f. sp. <i>dalbergiae</i></td><td><i>Dalbergia sissoo</i></td></tr>\n<tr><td>Heart rot – <i>Phellinus (Fomes) caryophylli</i></td><td>Sal</td></tr>\n<tr><td>Root rot – <i>Polyporus shoreae</i></td><td>Sal</td></tr>\n<tr><td>Pink disease – <i>Corticium salmonicolor</i></td><td>Eucalyptus</td></tr>\n<tr><td>Blister rust – <i>Cronartium ribicola</i></td><td>Five-needle pines (<i>P. wallichiana</i>)</td></tr>\n<tr><td>Teak rust – <i>Olivea tectonae</i>; powdery mildew</td><td>Teak</td></tr>\n<tr><td>Chestnut blight – <i>Cryphonectria parasitica</i>; Dutch elm – <i>Ophiostoma</i></td><td>(classic textbook cases)</td></tr>\n</table>\n<p>Disease triangle: susceptible host + virulent pathogen + favourable environment. <b>Koch's postulates</b> prove causation. Bordeaux mixture = copper sulphate + lime + water (1:1:100). IPM combines cultural, biological, mechanical, chemical control.</p>\n","cf":"\n<h3>1. Emergence and evolution in Nepal</h3>\n<table>\n<tr><th>Year (AD / BS)</th><th>Milestone</th></tr>\n<tr><td>1957 / 2013</td><td>Private Forests Nationalisation Act – all forests nationalised; people lost traditional rights</td></tr>\n<tr><td>1961 / 2018</td><td>Forest Act 2018 – forest categories; local responsibility weak</td></tr>\n<tr><td>1967 / 2024</td><td>Forest Protection (Special Arrangement) Act</td></tr>\n<tr><td>1976 / 2033</td><td>National Forestry Plan – recognised people's participation</td></tr>\n<tr><td>1978 / 2035</td><td><b>Panchayat Forest (PF) &amp; Panchayat Protected Forest (PPF) Rules</b> – first legal base for CF (handed to local Panchayats)</td></tr>\n<tr><td>1988–89 / 2045</td><td><b>Master Plan for the Forestry Sector (MPFS)</b> – 21-year plan; CF given top priority; hand over to <i>users</i></td></tr>\n<tr><td>1990</td><td>Restoration of democracy; Revised Forestry Sector Policy 1989/2000</td></tr>\n<tr><td>1993 / 2049</td><td><b>Forest Act 2049</b> – CFUGs autonomous, self-governing, perpetual-succession bodies</td></tr>\n<tr><td>1995 / 2051</td><td>Forest Regulation 2051; <b>FECOFUN</b> established (Federation of Community Forestry Users, Nepal)</td></tr>\n<tr><td>2000</td><td>Revised Forest Policy – collaborative forest management in Terai</td></tr>\n<tr><td>2014 / 2071</td><td>Community Forestry Development Guideline (revised)</td></tr>\n<tr><td>2015</td><td>Constitution of Nepal – federal structure; forests in federal, provincial, local competencies</td></tr>\n<tr><td>2019 / 2075–76</td><td>National Forest Policy 2075; <b>Forest Act 2076</b>; Forest Regulation 2079 (2022)</td></tr>\n</table>\n<p>Early projects: Nepal–Australia Forestry Project (Sindhupalchok &amp; Kabhre, from 1978), Nepal–Swiss Community Forestry Project (Dolakha, Ramechhap, Okhaldhunga), Hill Forest Development Project, Livelihoods &amp; Forestry Programme (DFID), Multi-Stakeholder Forestry Programme (MSFP).</p>\n\n<h3>2. Master Plan for the Forestry Sector (1988)</h3>\n<p><b>Six primary programmes</b>: (1) Community &amp; private forestry, (2) National &amp; leasehold forestry, (3) Wood-based industries, (4) Medicinal &amp; aromatic plants, (5) Soil conservation &amp; watershed management, (6) Conservation of ecosystems &amp; genetic resources. <b>Six supportive programmes</b>: policy &amp; legal reform, institutional reform, human resource development, research &amp; extension, forest resource information &amp; management planning, monitoring &amp; evaluation.</p>\n\n<h3>3. Users, user groups and their structure</h3>\n<ul>\n<li><b>Forest users</b> = households traditionally using the forest. Identification by user identification survey, considering traditional use, distance, distant users, and equity.</li>\n<li><b>CFUG structure</b>: General Assembly (supreme body, all households) → Executive Committee (elected) → sub-committees/toles. CF guideline: at least <b>50% women</b> in the executive committee and either the chair or the secretary must be a woman; proportional inclusion of Dalit, Janajati, poor.</li>\n<li>Wealth (well-being) ranking classifies households (e.g. rich, medium, poor, very poor) to target pro-poor benefits.</li>\n</ul>\n\n<h3>4. RRA and PRA</h3>\n<ul>\n<li><b>RRA</b> (Rapid Rural Appraisal, 1970s–80s): outsiders extract information quickly; <b>PRA</b> (Participatory Rural Appraisal, Robert Chambers, late 1980s–90s): local people analyse their own situation; outsider = facilitator. PLA = Participatory Learning &amp; Action.</li>\n<li>Tools: social map, resource map, transect walk, seasonal calendar, daily activity clock, historical timeline/trend line, Venn (chapati) diagram, well-being ranking, matrix/pair-wise ranking, problem tree, mobility map, focus group discussion (FGD), key informant interview (KII), semi-structured interview.</li>\n<li>Principles: triangulation, optimal ignorance, offsetting biases, learning from and with people, handing over the stick.</li>\n</ul>\n\n<h3>5. Handover process</h3>\n<p>Awareness &amp; user identification → forest boundary identification → <b>constitution (Bidhan)</b> drafted and approved by General Assembly → <b>registration</b> of CFUG at the Division Forest Office (DFO) → forest inventory → <b>Operational Plan</b> prepared with DFO and approved by assembly → handover certificate by DFO → implementation → review/renewal of OP (up to 10 years under Forest Act 2076).</p>\n<p>Constitution = rules on membership, committee, meetings, fund. OP = technical forest management plan.</p>\n\n<h3>6. Harvesting and distribution</h3>\n<ul>\n<li>Harvest by block as prescribed (AAC); distribution of timber, fuelwood, fodder, NTFP by need-based, equal, or price-based (subsidised for poor) mechanisms; surplus may be sold outside the group.</li>\n<li>Public hearing/auditing and annual report to DFO increase transparency.</li>\n</ul>\n\n<h3>7. Governance, gender and social inclusion (GESI)</h3>\n<ul>\n<li>Good governance pillars: transparency, accountability, participation, predictability (rule of law), equity, effectiveness.</li>\n<li>GESI: representation of women, Dalits, Janajatis, Madhesi, poor in decision-making; pro-poor income programmes; Gender &amp; Social Inclusion Strategy of the forestry sector.</li>\n<li>Decision-making: consensus/majority in assembly; inclusive meetings at times suitable for women.</li>\n</ul>\n\n<h3>8. Communication and livelihood capitals</h3>\n<ul>\n<li>Communication: sender → message → channel → receiver → feedback. Extension methods: individual (farm visit), group (demonstration, meeting), mass (radio, posters).</li>\n<li><b>Five capitals</b> (DFID Sustainable Livelihoods Framework, 1999): <b>Natural, Physical, Human, Social, Financial</b>. CF builds all five: forest (natural), trails/schools (physical), skills (human), networks &amp; institutions (social), group fund &amp; credit (financial).</li>\n</ul>\n\n<h3>9. Current status</h3>\n<p>By mid-March 2025, 23,601 CFUGs were managing about 2.51 million ha (MoFE data reported by Republica); by July 2025 over 3.2 million households were involved through 23,090 handed-over CFs (Spotlight). Roughly one-third of the national forest area is community managed.</p>\n","mens":"\n<h3>1. Forest statistics of Nepal</h3>\n<table>\n<tr><th>Assessment</th><th>Forest</th><th>Shrub / OWL</th><th>Total</th></tr>\n<tr><td>LRMP (1978–79)</td><td>38.0%</td><td>4.7%</td><td>42.7%</td></tr>\n<tr><td>NFI (1987–98, publ. 1999)</td><td>29.0%</td><td>10.6%</td><td>39.6%</td></tr>\n<tr><td>FRA Nepal (2010–14, publ. 2015)</td><td>40.36%</td><td>4.38%</td><td>44.74%</td></tr>\n<tr><td>MoFE / FRTC (2024)</td><td>43.38%</td><td>2.70%</td><td><b>46.08%</b></td></tr>\n</table>\n<p>FRA 2015 (DFRS): ≈443 tree species recorded; average growing stock ≈165 m³/ha; Sal the most dominant species; Middle Mountains have the largest forest area. FRTC (Forest Research and Training Centre) is the national agency for forest resource assessment.</p>\n\n<h3>2. Tree measurement</h3>\n<ul>\n<li><b>DBH</b> at 1.3 m above ground (Nepal; 1.37 m / 4.5 ft in USA/India). On slopes measure from the uphill side. Basal area g = πd²/4 = 0.7854 d² (d in m).</li>\n<li>Instruments – diameter: calipers, diameter (π) tape, Biltmore stick; height: <b>Abney level, Haga altimeter, Blume-Leiss, Suunto clinometer, Christen hypsometer, Vertex/laser hypsometer, Spiegel relascope</b>; age/increment: <b>Pressler increment borer</b>; bark: bark gauge; basal area per ha: wedge prism / relascope (Bitterlich angle-count, BAF).</li>\n<li>Height by trigonometry: H = D (tan α₁ ± tan α₂) (+ when angles are on opposite sides of horizontal).</li>\n<li>Log volume: <b>Huber</b> V = A<sub>m</sub>·L (mid-area); <b>Smalian</b> V = (A₁ + A₂)/2 · L; <b>Newton</b> V = (A₁ + 4A<sub>m</sub> + A₂)/6 · L (most accurate). Tree volume = g · h · f (form factor).</li>\n<li>Form factor ≈ 0.5 for many tree stems (cone 0.33, paraboloid 0.5, cylinder 1.0). Quarter-girth (Hoppus) system used in timber trade.</li>\n<li>Pressler's growth percent P = (V₂ − V₁)/(V₂ + V₁) × 200/n.</li>\n</ul>\n\n<h3>3. Stand measurement, growth &amp; yield</h3>\n<ul>\n<li>Stand density: stems/ha, basal area/ha, stand density index (Reineke), crown closure. Site index = height of dominant trees at base age.</li>\n<li><b>Volume tables</b>: local (one entry – DBH), standard/general (two entries – DBH &amp; height), form-class tables. <b>Yield tables</b>: normal, empirical, variable-density.</li>\n<li>Growth models: Chapman–Richards, Schumacher, Gompertz, logistic; diameter-distribution and individual-tree models.</li>\n<li>Nepal stem volume: ln V = a + b ln D + c ln H (Sharma &amp; Pukkala 1990); biomass from wood density × volume × expansion factor; carbon ≈ 0.47–0.50 × biomass; CO₂ = C × 44/12 (3.67).</li>\n</ul>\n\n<h3>4. Sampling</h3>\n<ul>\n<li>Methods: simple random, systematic (most used in forestry: grid/line plots), stratified (by forest type/condition – increases precision), cluster, multistage, double sampling, <b>PPS</b> (point/angle-count sampling = probability proportional to basal area).</li>\n<li>SE = s/√n (× √(1 − n/N) for finite population). CI = x̄ ± t·SE. Sample size n = t²·CV²/E² (E = allowable % error). Sampling intensity = sampled area / total area × 100.</li>\n</ul>\n\n<h3>5. Experimental design</h3>\n<ul>\n<li>Fisher's three principles: <b>replication, randomisation, local control</b>.</li>\n<li><b>CRD</b> – homogeneous units (nursery, lab). <b>RCBD</b> – one gradient, blocks; error df = (t−1)(r−1). <b>Latin square</b> – two gradients (rows &amp; columns); t = r. <b>Split plot</b> – main plot (factor hard to change, e.g. irrigation) &amp; sub plot; two error terms. <b>Factorial</b> – two or more factors with interaction (e.g. 3×2 = 6 treatment combinations).</li>\n</ul>\n\n<h3>6. Statistical methods</h3>\n<ul>\n<li>Mean, median, mode; variance, SD, <b>CV = SD/mean × 100</b>.</li>\n<li><b>t-test</b> (compare two means, small n), paired t-test, <b>χ² test</b> (association/goodness of fit, frequency data), <b>ANOVA</b> F = MS<sub>treatment</sub>/MS<sub>error</sub> (compare ≥3 means), post-hoc LSD/Tukey/DMRT, <b>ANCOVA</b> (adjusts for a covariate), <b>correlation</b> r (−1 to +1; strength of linear association), <b>regression</b> (prediction; Y = a + bX; R² = explained variation).</li>\n<li>Type I error = rejecting a true H₀ (α); Type II = accepting a false H₀ (β). Power = 1 − β. Non-parametric: Mann–Whitney, Kruskal–Wallis, Wilcoxon.</li>\n</ul>\n\n<h3>7. Remote sensing, GIS, photo interpretation</h3>\n<ul>\n<li>Vegetation reflects strongly in <b>NIR</b>, absorbs red &amp; blue. <b>NDVI = (NIR − Red)/(NIR + Red)</b>, range −1 to +1.</li>\n<li>Resolutions: spatial, spectral, radiometric, temporal. Passive sensors (Landsat 30 m/16 days, Sentinel-2 10 m/5 days, MODIS 250 m–1 km daily) vs active (RADAR/SAR, <b>LiDAR</b> – canopy height &amp; biomass).</li>\n<li>GIS data models: <b>vector</b> (point, line, polygon) and <b>raster</b> (grid cells). Overlay, buffer, interpolation, DEM/slope/aspect.</li>\n<li>Nepal uses <b>MUTM</b> (Modified UTM) on Everest 1830 spheroid with 3° zones (central meridians 81°, 84°, 87° E), scale factor 0.9999; standard UTM zones 44 &amp; 45 N. Topographic maps: 1:25,000 and 1:50,000 (Survey Department).</li>\n<li>Aerial photo scale = f/H (focal length ÷ flying height above ground). Elements of interpretation: tone, texture, pattern, shape, size, shadow, site, association. Stereoscopic vision from overlap (~60% forward, ~30% side). Parallax gives height.</li>\n<li>GPS needs ≥4 satellites for a 3-D fix.</li>\n</ul>\n\n<h3>8. Surveying and maps</h3>\n<ul>\n<li>Chain: Gunter's chain = 66 ft = 100 links; metric chains 20 m / 30 m. Ranging, offsets.</li>\n<li>Compass: <b>prismatic compass – whole circle bearing (WCB, 0–360°)</b>; surveyor's compass – quadrantal bearing (QB). Back bearing = FB ± 180°. Local attraction detected when FB − BB ≠ 180°.</li>\n<li>Closing error of a traverse adjusted by <b>Bowditch (compass) rule</b>. Plane table (radiation, intersection, traversing, resection), theodolite, total station, levelling.</li>\n<li>Map scale (RF): 1 cm on map = 250 m on ground → 1:25,000. Contours: closely spaced = steep; V pointing upstream = valley.</li>\n</ul>\n\n<h3>9. National Forest Inventory and ground verification</h3>\n<ul>\n<li>FRA Nepal (2010–14, with Finland): Landsat-based mapping + systematic grid of permanent sample plots (concentric circular plots of 20, 15, 8, 4 m radius) + socio-economic survey; re-measurement started 2016.</li>\n<li>Ground truthing/verification validates image classification; accuracy assessment by error (confusion) matrix – overall accuracy, kappa, user's &amp; producer's accuracy.</li>\n</ul>\n<div class=\"box\"><b>Fast formulas:</b> g = 0.7854d² · Smalian (A₁+A₂)/2·L · Newton (A₁+4Am+A₂)/6·L · NDVI (NIR−R)/(NIR+R) · n = t²CV²/E² · SE = s/√n · photo scale f/H · CO₂ = C × 3.67</div>\n","soil":"\n<h3>1. Soil formation, profile, properties, classification</h3>\n<ul>\n<li>Soil-forming factors (Jenny 1941): <b>S = f(cl, o, r, p, t)</b> – climate, organisms, relief, parent material, time. Climate and organisms are active factors; relief, parent material, time are passive.</li>\n<li>Weathering: physical (temperature, frost wedging, exfoliation), chemical (hydrolysis – most important for silicates, oxidation, carbonation, hydration, solution), biological.</li>\n<li>Profile: <b>O</b> (organic) – <b>A</b> (topsoil, eluviation begins) – <b>E</b> (eluviated, bleached) – <b>B</b> (illuviation, accumulation of clay/Fe/Al) – <b>C</b> (weathered parent material) – <b>R</b> (bedrock). Solum = A + B.</li>\n<li>Texture (USDA): sand 2–0.05 mm, silt 0.05–0.002 mm, clay &lt;0.002 mm; 12 textural classes; loam ≈ balanced. Measured by hydrometer (Bouyoucos) or pipette method.</li>\n<li>Particle density ≈ 2.65 g/cm³; bulk density 1.1–1.6 g/cm³; porosity = (1 − BD/PD) × 100. CEC higher in clay &amp; humus. pH: acidic &lt;6.5, neutral 6.5–7.5, alkaline &gt;7.5; lime corrects acidity, gypsum sodicity.</li>\n<li>USDA Soil Taxonomy – 12 orders: Entisols, Inceptisols (common in Nepal's hills), Mollisols, Alfisols, Ultisols, Oxisols, Vertisols, Aridisols, Spodosols, Histosols, Andisols, Gelisols.</li>\n</ul>\n\n<h3>2. Land use and land capability classification</h3>\n<ul>\n<li>USDA land capability: <b>8 classes</b> (I–VIII). Classes I–IV suitable for cultivation (increasing limitations), V–VIII not suitable – pasture, forestry, wildlife, recreation (VIII). Subclasses: e (erosion), w (wetness), s (soil), c (climate).</li>\n<li>Nepal: LRMP (1986) land-system &amp; land-capability maps; Land Use Policy 2072; Land Use Act 2076 (zoning into agriculture, residential, commercial, industrial, forest, public use, etc.).</li>\n</ul>\n\n<h3>3. Hydrological cycle</h3>\n<p>Precipitation → interception (by canopy) → throughfall &amp; stemflow → infiltration → percolation → groundwater → baseflow; surface runoff; evaporation + transpiration = evapotranspiration. Forests increase interception, infiltration and transpiration; reduce peak runoff and sediment.</p>\n\n<h3>4. Erosion: types and control</h3>\n<ul>\n<li>Geological (natural) vs accelerated (human-induced). Agents: water, wind, gravity (mass wasting), glacier.</li>\n<li>Water erosion sequence: <b>splash (raindrop) → sheet → rill → gully</b>; plus stream-bank erosion, landslides, debris flows. Gully stages: formation, development, healing, stabilisation.</li>\n<li>Wind erosion: <b>saltation</b> (bouncing, ~50–75% of movement), <b>suspension</b> (fine particles), <b>surface creep</b> (large particles).</li>\n<li><b>USLE: A = R × K × LS × C × P</b> (Wischmeier &amp; Smith) – A soil loss (t/ha/yr), R rainfall erosivity, K soil erodibility, LS slope length–steepness, C cover-management, P support practice. RUSLE = revised.</li>\n<li>Tolerable soil loss (T) ≈ 5–12 t/ha/yr (commonly 11.2 t/ha/yr in USA).</li>\n</ul>\n\n<h3>5. Soil and water conservation structures</h3>\n<ul>\n<li>Agronomic/vegetative: contour farming, strip cropping, mulching, cover crops, crop rotation, hedgerows, grass strips.</li>\n<li>Mechanical: terraces (bench – level/outward/inward sloping; conservation), contour bunds &amp; trenches, diversion/cut-off drains, <b>check dams</b> (brushwood, loose stone, gabion, masonry), retaining walls, gabion walls, spurs/embankments for stream banks, sediment traps, conservation ponds.</li>\n<li>Check dam spacing: H/S rule (vertical interval = effective height of the dam); \"head-to-toe\" placement.</li>\n</ul>\n\n<h3>6. Bioengineering, soil fertility, indigenous practices</h3>\n<ul>\n<li>Bioengineering = living plants (alone or with structures) to stabilise slopes. Techniques: grass slips/contour lines, brush layering, palisades, live staking (cuttings), fascines, live check dams, vegetated stone pitching, turfing, jute netting with seeding.</li>\n<li>Species: Napier, <i>Saccharum spontaneum</i> (Kans), <i>Vetiveria/Chrysopogon zizanioides</i> (Vetiver/Khus), <i>Thysanolaena maxima</i> (Amriso), <i>Ipomoea carnea</i>, <i>Vitex negundo</i> (Simali), <i>Salix</i> (Bains), <i>Alnus nepalensis</i>, <i>Dendrocalamus</i> bamboo, <i>Agave</i> (Ketuki).</li>\n<li>Soil fertility: macronutrients N, P, K (+Ca, Mg, S); micronutrients; organic matter; FYM, compost, green manure, biofertiliser, legumes, liming.</li>\n<li>Indigenous practices in Nepal: bench terraces (khet &amp; bari), terrace-riser fodder trees, kulo (irrigation canals), pokhari (ponds), mixed cropping, leaf-litter bedding (sottar) for manure, slope-wise drainage.</li>\n</ul>\n\n<h3>7. Soil loss assessment and soil analysis</h3>\n<ul>\n<li>Soil loss: runoff/erosion plots, erosion pins, sediment yield at outlet (suspended sediment sampling), USLE/RUSLE modelling, Cs-137 tracer, GIS.</li>\n<li>Lab: pH (pH meter, 1:2.5 soil:water), organic carbon – <b>Walkley &amp; Black</b>; OM = OC × 1.724; total N – <b>Kjeldahl</b>; available P – <b>Olsen</b> (neutral–alkaline) / <b>Bray</b> (acidic); available K – ammonium acetate extraction, <b>flame photometer</b>; texture – hydrometer; bulk density – core method.</li>\n</ul>\n\n<h3>8. Institutions</h3>\n<p>Department of Soil Conservation and Watershed Management (DSCWM) established 2031 BS (1974); merged with Department of Forests in 2018 into the <b>Department of Forests and Soil Conservation (DoFSC)</b>. President Chure-Tarai Madhesh Conservation Development Board (2071 BS / 2014) works on the Chure (Siwalik) range, about 12.8% of Nepal's area spread over 36–37 districts.</p>\n","ws":"\n<h3>1. Concepts</h3>\n<ul>\n<li><b>Watershed</b> = area draining to a common outlet; boundary = ridge line/water divide. Hierarchy: river basin → sub-basin → watershed → sub-watershed → micro-watershed.</li>\n<li><b>Integrated watershed management</b>: manage land, water, forest, agriculture, livestock and infrastructure together, with people's participation, to conserve soil &amp; water and improve livelihoods. Upstream–downstream linkage is central.</li>\n<li>Nepal's first major watershed project: <b>Phewa Tal watershed</b> (1974, FAO/UNDP); others – Kulekhani (hydropower reservoir siltation), Tinau, Bagmati, Begnas–Rupa. Sub-watershed management plans prepared by DSCWM/DoFSC divisions.</li>\n<li>Planning steps: delineation (DEM/topomap) → reconnaissance &amp; baseline (bio-physical + socio-economic) → problem identification &amp; prioritisation (sediment yield index, erosion risk) → participatory planning → implementation → monitoring &amp; evaluation.</li>\n</ul>\n\n<h3>2. Forestry–agriculture–livestock–infrastructure linkages</h3>\n<p>Forests supply fodder (livestock) and leaf litter (manure) to farms – mid-hill farming systems depend on forests; livestock pressure leads to overgrazing; poorly built rural roads trigger landslides (green road concept, bioengineering on road slopes).</p>\n\n<h3>3. Hazards and early warning</h3>\n<ul>\n<li>Hazards: floods, flash floods, landslides, debris flows, <b>GLOFs</b> (glacial lake outburst floods), droughts.</li>\n<li>GLOF cases: Dig Tsho (1985, Bhote Koshi – destroyed Namche hydro project), Tsho Rolpa (Dolakha – early-warning system installed 1998 and lake lowered by 3 m in 2000), Imja (lowered 2016), Thulagi; Thame (Solukhumbu) GLOF in August 2024. ICIMOD (2020) identified 47 potentially dangerous glacial lakes in the Koshi, Gandaki and Karnali basins, 21 of them in Nepal.</li>\n<li>Early warning system (EWS): risk knowledge → monitoring &amp; warning (rain/river gauges, sirens, SMS) → dissemination → response capability. Community-based flood EWS in Karnali, Babai, Narayani, etc. Department of Hydrology and Meteorology (DHM) issues flood forecasts.</li>\n</ul>\n\n<h3>4. Discharge, water quality, runoff control</h3>\n<ul>\n<li><b>Discharge Q = A × V</b>. Methods: float method (mean velocity ≈ 0.85 × surface velocity), current meter (velocity–area), weirs/notches (V-notch for small flows), salt (dilution) method, Parshall flume. Stage–discharge rating curve.</li>\n<li><b>Rational formula: Q = C·I·A / 360</b> (Q in m³/s, I mm/h, A ha; C runoff coefficient – higher for bare/paved, lower for forest).</li>\n<li>Hydrograph: rising limb, peak, recession limb; lag time; forests delay and lower the peak.</li>\n<li>Water quality parameters: pH, temperature, turbidity, TSS/TDS, DO, BOD, COD, nitrate, phosphate, coliform (faecal) bacteria. Macro-invertebrates as bio-indicators.</li>\n<li>Runoff control: diversion drains, cut-off drains, contour trenches, check dams, retention ponds, vegetative cover.</li>\n</ul>\n\n<h3>5. Water harvesting and conservation farming</h3>\n<ul>\n<li>Rainwater harvesting: rooftop, conservation (plastic-lined) ponds, recharge ponds, check dams, pokhari restoration; spring-shed management (springs drying in mid-hills).</li>\n<li>Conservation farming: minimum/zero tillage, mulching, contour farming, cover crops, SALT, agroforestry hedgerows, crop rotation with legumes.</li>\n</ul>\n\n<h3>6. Agroforestry, species selection, participation</h3>\n<p>Choose species that give quick income and protection: Amriso (broom grass), fodder trees, fruit (citrus, mango), cardamom with Utis, bamboo, NTFPs (Timur, Lemongrass, Chiraito). Participatory approaches: user committees, sub-watershed conservation committees, cost-sharing, local planning, gender inclusion, PRA tools.</p>\n","wl":"\n<h3>1. Protected-area system of Nepal</h3>\n<p>Legal base: <b>National Parks and Wildlife Conservation Act 2029 (1973)</b>; Buffer Zone provision added by the 4th amendment (2049 BS/1993); Buffer Zone Management Regulation 2052. Managing agency: Department of National Parks and Wildlife Conservation (DNPWC). Conservation areas may be handed to NGOs/communities (ACA – NTNC; KCA – Kanchenjunga CA Management Council, 2006).</p>\n<p>Before August 2025: 12 national parks, 1 wildlife reserve, 1 hunting reserve, 6 conservation areas and 13 buffer zones (20 PAs) covering 34,419.75 km² (<b>23.39%</b> of Nepal). In August 2025 the government created <b>Chhayanath National Park</b> (Mugu, carved from Shey-Phoksundo), raising national parks to <b>13</b>. Shey-Phoksundo remains the largest park.</p>\n<table>\n<tr><th>Protected area</th><th>Est.</th><th>Notes</th></tr>\n<tr><td>Chitwan NP</td><td>1973</td><td>First NP; UNESCO WHS 1984; rhino, tiger, gharial</td></tr>\n<tr><td>Langtang NP</td><td>1976</td><td>First Himalayan NP; red panda</td></tr>\n<tr><td>Rara NP</td><td>1976</td><td>Smallest NP (106 km²); Rara lake (largest lake of Nepal)</td></tr>\n<tr><td>Sagarmatha NP</td><td>1976</td><td>UNESCO WHS 1979; snow leopard, musk deer</td></tr>\n<tr><td>Shey-Phoksundo NP</td><td>1984</td><td>Largest NP; Phoksundo (deepest lake); trans-Himalayan</td></tr>\n<tr><td>Khaptad NP</td><td>1984</td><td>Mid-hill plateau, Sudurpaschim</td></tr>\n<tr><td>Bardiya NP</td><td>1976 reserve, 1988 NP</td><td>Largest Terai NP; tigers, translocated rhinos</td></tr>\n<tr><td>Makalu-Barun NP</td><td>1991</td><td>Steepest altitudinal range (435–8,463 m)</td></tr>\n<tr><td>Shivapuri-Nagarjun NP</td><td>2002</td><td>Kathmandu water source</td></tr>\n<tr><td>Banke NP</td><td>2010</td><td>Linked with Bardiya; tiger landscape</td></tr>\n<tr><td>Shuklaphanta NP</td><td>1976 reserve, 2017 NP</td><td>Swamp deer (barasingha), Bengal florican</td></tr>\n<tr><td>Parsa NP</td><td>1984 reserve, 2017 NP</td><td>Joins Chitwan; gaur, tiger</td></tr>\n<tr><td>Chhayanath NP</td><td>2025</td><td>13th NP, Mugu</td></tr>\n<tr><td>Koshi Tappu WR</td><td>1976</td><td>Only wild water buffalo (Arna); first Ramsar site (1987)</td></tr>\n<tr><td>Dhorpatan HR</td><td>1987</td><td>Only hunting reserve; blue sheep</td></tr>\n<tr><td>Conservation areas</td><td></td><td>Annapurna (1986, gazetted 1992; first CA and largest PA; NTNC), Kanchenjunga (1997), Manaslu (1998), Blackbuck/Krishnasar (2009), Api-Nampa (2010), Gaurishankar (2010)</td></tr>\n</table>\n<p>Provincial: Sudurpaschim declared the <b>Badimalika–Ramaroshan Forest Conservation Area</b> (498.4 km²) on 12 August 2026 under its Provincial Forest Act 2077.</p>\n<p><b>Ramsar sites (10)</b>: Koshi Tappu (1987), Beeshazar &amp; associated lakes, Ghodaghodi, Jagadishpur Reservoir (2003), Gokyo, Gosaikunda, Phoksundo, Rara (2007), Mai Pokhari (2008), Lake Cluster of Pokhara Valley (2016).</p>\n\n<h3>2. PA management planning</h3>\n<ul>\n<li>Management plan (usually 5 years): zoning (core, buffer, multiple use, tourism/intensive use, wilderness), habitat management, anti-poaching, research &amp; monitoring, community support.</li>\n<li>Buffer zones: <b>30–50% of park revenue</b> goes to buffer-zone community development; BZ user committees/groups.</li>\n<li><b>Ecotourism &amp; visitor management</b>: carrying capacity, <b>Limits of Acceptable Change (LAC)</b>, Visitor Impact Management (VIM), zoning, entry fees, homestays.</li>\n<li>Conflict resolution: human–wildlife conflict (crop raiding by elephants &amp; wild boar, livestock depredation by leopards/tigers, deaths); mitigation – electric/solar fences, trenches, predator-proof sheds, early warning, relief/compensation under the Wildlife Damage Relief Guideline, insurance; park–people conflict over resource access.</li>\n<li>Monitoring: camera traps, transects, SMART patrolling, occupancy surveys, DNA (scat) – rhino census planned using DNA from dung.</li>\n</ul>\n\n<h3>3. Population ecology</h3>\n<ul>\n<li>Exponential growth dN/dt = rN (J-curve); logistic dN/dt = rN(1 − N/K) (S-curve; K = carrying capacity). r-strategists (many small offspring) vs K-strategists (few, large, parental care – elephant, rhino, tiger).</li>\n<li>Abundance: <b>Lincoln–Petersen N = M·C/R</b>; capture–recapture with camera traps (SECR for tigers/snow leopards), distance sampling, pellet counts. Minimum viable population; 50/500 rule; metapopulation; effective population size N<sub>e</sub>.</li>\n<li>Life tables, survivorship curves (Type I – humans/large mammals, II – birds, III – fish/insects).</li>\n</ul>\n\n<h3>4. Biodiversity conservation approaches</h3>\n<p><b>In-situ</b> (PAs, CFs, corridors, sacred groves) and <b>ex-situ</b> (zoos – Central Zoo, Jawalakhel; botanical gardens – Godawari; seed/gene banks; breeding centres – gharial breeding at Kasara, Chitwan (1978); vulture breeding). Landscape approach: <b>Terai Arc Landscape (TAL, 2001)</b>, Chitwan–Annapurna Landscape (CHAL), Sacred Himalayan Landscape (SHL), Kailash and Kanchenjunga landscapes. Corridors: Khata (Bardiya–Katarniaghat), Basanta (Dudhwa–Laljhadi), Barandabhar (Chitwan–Mahabharat), Laljhadi–Mohana. Vulture conservation: diclofenac ban (2006), \"Jatayu restaurants\", vulture-safe zones.</p>\n\n<h3>5. Key species of Nepal</h3>\n<table>\n<tr><th>Species</th><th>Status / facts</th></tr>\n<tr><td>Bengal tiger <i>Panthera tigris</i></td><td>EN. National Tiger &amp; Prey Base Survey 2026: <b>429</b> (Chitwan 145, Bardiya 112, Parsa 71, Banke 51, Shuklaphanta 50); 355 in 2022, 121 in 2009–10. Solitary, territorial; prey – chital, sambar, wild boar.</td></tr>\n<tr><td>Greater one-horned rhino <i>Rhinoceros unicornis</i></td><td>VU. <b>752</b> in 2021 count (Chitwan 694, Bardiya 38, Shuklaphanta 17, Parsa 3); new DNA-based count pending. Grazer of floodplains, dung middens, solitary.</td></tr>\n<tr><td>Asian elephant <i>Elephas maximus</i></td><td>EN. Resident herds in Terai (~200–250) + migratory herds from India; matriarchal herds; major conflict species.</td></tr>\n<tr><td>Snow leopard <i>Panthera uncia</i></td><td>VU. First national estimate (2025): <b>397</b> (1.56/100 km²), via camera-trap &amp; genetic SECR; prey – blue sheep, Himalayan tahr.</td></tr>\n<tr><td>Red panda <i>Ailurus fulgens</i></td><td>EN. Bamboo (<i>Arundinaria</i>) understorey in temperate forest 2,200–4,800 m; eastern &amp; central hills; CF-based conservation.</td></tr>\n<tr><td>Gharial <i>Gavialis gangeticus</i></td><td>CR. Fish-eating; Narayani, Rapti, Karnali, Babai; Kasara breeding centre.</td></tr>\n<tr><td>Others</td><td>Wild water buffalo (Arna) – Koshi Tappu; Swamp deer – Shuklaphanta; Blackbuck – Khairapur, Bardiya; Gaur – Chitwan/Parsa; Pangolins (Chinese &amp; Indian) – CR/EN; Bengal florican – CR; Gangetic dolphin – Karnali/Koshi.</td></tr>\n</table>\n<p>NPWC Act protected species: <b>27 mammals, 9 birds, 3 reptiles</b> (e.g. Danfe/Himalayan monal, Munal/satyr tragopan, cheer pheasant, Bengal &amp; lesser florican, sarus crane, giant hornbill, black &amp; white stork; gharial, python, golden monitor lizard). National bird: Danfe (<i>Lophophorus impejanus</i>); national animal: cow; national flower: Lali Gurans (<i>Rhododendron arboreum</i>).</p>\n\n<h3>6. Habitat types and management</h3>\n<p>Grasslands (phanta – Shuklaphanta, Bardiya; managed by cutting, controlled burning, ploughing, removing invasive <i>Mikania</i>), wetlands (desilting, removing water hyacinth), riverine forests, Sal forest, mid-hill forests, temperate/subalpine forests, alpine meadows, trans-Himalaya. Waterholes, salt licks, corridor restoration.</p>\n\n<h3>7. Red List, strategies, EIA</h3>\n<ul>\n<li><b>IUCN Red List</b> categories: EX, EW, <b>CR, EN, VU</b> (threatened), NT, LC, DD, NE.</li>\n<li><b>CITES</b> (1973, Washington; Nepal party 1975) – Appendix I (trade banned – tiger, rhino, snow leopard), II (regulated – <i>Taxus</i>, many orchids), III. Nepal's CITES Act 2073 (2017). Other conventions: Ramsar (1971), WHC (1972), CMS/Bonn (1979), <b>CBD (1992)</b>, UNFCCC (1992), UNCCD (1994). Kunming–Montreal GBF (2022) – \"30×30\".</li>\n<li>National Biodiversity Strategy &amp; Action Plan (NBSAP 2014–2020, updated after the GBF); Protected Area Management Strategy 2022–2030; species action plans for tiger, rhino, elephant, snow leopard, red panda, vultures, pangolin.</li>\n<li><b>Environment Protection Act 2076 (2019)</b> and Regulation 2077: three levels – <b>BES</b> (Brief Environmental Study), <b>IEE</b>, <b>EIA</b>. EIA steps: screening → scoping → baseline → impact prediction → mitigation &amp; EMP → public hearing → review/approval → monitoring/audit.</li>\n<li>Global: St Petersburg Tiger Summit 2010 – <b>TX2</b> (double tigers by 2022); Nepal nearly tripled (121 → 355). GSLEP (Bishkek 2013) for snow leopards.</li>\n</ul>\n","util":"\n<h3>1. Economically important NTFPs of Nepal</h3>\n<table>\n<tr><th>Local name</th><th>Scientific name</th><th>Part / use</th></tr>\n<tr><td>Yarsagumba</td><td><i>Ophiocordyceps sinensis</i></td><td>Fungus on ghost-moth larva; alpine meadows (&gt;3,500 m); highest value NTFP</td></tr>\n<tr><td>Jatamansi / Bhulte</td><td><i>Nardostachys jatamansi</i></td><td>Rhizome – essential oil; CITES App. II</td></tr>\n<tr><td>Sugandhawal</td><td><i>Valeriana jatamansi</i></td><td>Rhizome – sedative, oil</td></tr>\n<tr><td>Kutki</td><td><i>Neopicrorhiza scrophulariiflora</i></td><td>Rhizome – liver tonic</td></tr>\n<tr><td>Chiraito</td><td><i>Swertia chirayita</i></td><td>Whole plant – bitter tonic, antimalarial; major export</td></tr>\n<tr><td>Timur</td><td><i>Zanthoxylum armatum</i></td><td>Fruit – spice, oil</td></tr>\n<tr><td>Lokta</td><td><i>Daphne bholua, D. papyracea</i></td><td>Bark – handmade (Nepali) paper</td></tr>\n<tr><td>Allo</td><td><i>Girardinia diversifolia</i></td><td>Bark fibre – textiles</td></tr>\n<tr><td>Sugandhakokila</td><td><i>Cinnamomum glaucescens</i></td><td>Berry – essential oil</td></tr>\n<tr><td>Tejpat</td><td><i>Cinnamomum tamala</i></td><td>Leaf – spice</td></tr>\n<tr><td>Satuwa</td><td><i>Paris polyphylla</i></td><td>Rhizome – medicine; high demand</td></tr>\n<tr><td>Panchaule</td><td><i>Dactylorhiza hatagirea</i></td><td>Tuber (orchid) – protected</td></tr>\n<tr><td>Pakhanbed</td><td><i>Bergenia ciliata</i></td><td>Rhizome – kidney stone medicine</td></tr>\n<tr><td>Rittha</td><td><i>Sapindus mukorossi</i></td><td>Fruit – natural soap (saponin)</td></tr>\n<tr><td>Amala</td><td><i>Phyllanthus emblica</i></td><td>Fruit – vitamin C; triphala (with Harro, Barro)</td></tr>\n<tr><td>Kurilo</td><td><i>Asparagus racemosus</i></td><td>Root – tonic</td></tr>\n<tr><td>Chiuri</td><td><i>Diploknema butyracea</i></td><td>Seed – butter/ghee (Chepang livelihood)</td></tr>\n<tr><td>Dhasingre (Wintergreen)</td><td><i>Gaultheria fragrantissima</i></td><td>Leaf – methyl salicylate oil</td></tr>\n<tr><td>Khayar</td><td><i>Acacia catechu</i></td><td>Heartwood – katha &amp; cutch</td></tr>\n<tr><td>Sal</td><td><i>Shorea robusta</i></td><td>Resin (Rani dhup), leaf plates (tapari/duna), seed oil</td></tr>\n<tr><td>Lauth salla</td><td><i>Taxus wallichiana</i></td><td>Leaves/bark – taxol</td></tr>\n<tr><td>Amriso</td><td><i>Thysanolaena maxima</i></td><td>Broom; fodder; soil conservation</td></tr>\n<tr><td>Bamboo &amp; rattan (Bet)</td><td><i>Dendrocalamus, Bambusa; Calamus</i></td><td>Construction, crafts, furniture</td></tr>\n</table>\n\n<h3>2. Collection, processing and marketing of high-value NTFPs</h3>\n<ul>\n<li>Value chain: collector → local trader/collector-trader → road-head trader → regional trader (Nepalgunj, Dhangadhi, Biratnagar, Kathmandu) → Indian wholesaler (Delhi, Tanakpur, Ramnagar) / processor → consumer. Most NTFPs are exported raw to India – low value-addition.</li>\n<li>Good practice: sustainable harvesting (rotational, leaving mother plants, right season – e.g. after seed fall), drying &amp; grading, storage, distillation of essential oils (Jatamansi, Sugandhawal, Wintergreen, Lemongrass), cooperative marketing, certification (organic/FairWild), domestication &amp; cultivation (Chiraito, Timur, Kurilo).</li>\n<li>Regulation: collection/transport permits and royalty under the Forest Act &amp; Regulation; some species are banned or restricted for collection, transport or raw export; CITES permits for listed species.</li>\n</ul>\n\n<h3>3. Forest-based industries</h3>\n<p>Sawmills, plywood &amp; veneer, furniture, particle/MDF board, katha (cutch), resin &amp; turpentine (from chir pine resin), handmade paper (Lokta), essential-oil distilleries, ayurvedic medicine, bamboo/rattan crafts, briquettes, matches, leaf plates. Nepal still imports large volumes of timber despite rising forest cover.</p>\n\n<h3>4. Wood science essentials</h3>\n<ul>\n<li>Hardwood (angiosperm – vessels/pores) vs softwood (gymnosperm – tracheids, no vessels, resin canals). Ring-porous (Teak, Toona) vs diffuse-porous (Sal, most tropical hardwoods). Heartwood (dark, durable, extractives) vs sapwood.</li>\n<li>Seasoning: air seasoning, kiln seasoning, solar, water seasoning. Defects: knots, shakes (cup/ring, star, heart), checks, splits, warping (cup, bow, crook, twist), case-hardening, honey-combing.</li>\n<li>Preservation: preservatives – <b>creosote</b> (oil type), <b>CCA</b> (copper-chrome-arsenic), ASCU, borax-boric acid; processes – non-pressure (brushing, dipping, steeping, hot-and-cold bath, sap displacement/Boucherie) and pressure (<b>Bethell full-cell</b>; Rueping and Lowry empty-cell).</li>\n<li>Resin tapping of <i>Pinus roxburghii</i>: rill/American (cup-and-lip) method; resin → rosin + turpentine by distillation.</li>\n</ul>\n\n<h3>5. Institutions</h3>\n<ul>\n<li><b>HPPCL</b> – Herbs Production and Processing Company Limited (govt, 1981): cultivation, processing (essential oils, extracts) and marketing of medicinal herbs.</li>\n<li><b>FPDB</b> – Forest Products Development Board: promotes private/community forestry, plantation and forest-based enterprise, timber market information.</li>\n<li><b>TCN</b> – Timber Corporation of Nepal (1959/60): harvesting, sawing, supply and sale of timber &amp; fuelwood from government forests, timber depots.</li>\n<li>Department of Plant Resources (DPR; National Herbarium, Godawari; Singha Durbar Vaidyakhana – ayurvedic medicines), ANSAB (NTFP enterprise NGO), FECOFUN, NEHHPA (Nepal Herbs and Herbal Products Association).</li>\n</ul>\n\n<h3>6. Forest products and poverty reduction</h3>\n<p>NTFPs give seasonal cash to remote, poor households (e.g. Yarsagumba in Dolpa/Darchula; Chiuri for Chepang; Lokta paper in Baglung, Dolakha). Pathways: income &amp; employment, community forest enterprises (allowed under Forest Act 2076), pro-poor fund allocation, leasehold forestry for the poor, value addition near source, cooperatives, skill training.</p>\n"};</script>

{
const $=s=>document.querySelector(s), app=$('#app');

const K='afuMscTrainer1';
const load=()=>{try{return JSON.parse(localStorage.getItem(K))||{}}catch(e){return {}}};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(ST))}catch(e){}};
