let timerH=null;
function stopTimer(){clearInterval(timerH);timerH=null;$('#tm').textContent=''}
function shuffle(a,seed){a=a.slice();let s=seed||Math.random()*1e9|0;const r=()=>(s=(s*1664525+1013904223)%4294967296)/4294967296;for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function rec(q,ch){ST.ans=ST.ans||{};const r=ST.ans[q.id]||[0,0];r[0]++;if(ch===q.a)r[1]++;ST.ans[q.id]=r;ST.wrong=ST.wrong||{};if(ch===q.a)delete ST.wrong[q.id];else ST.wrong[q.id]=1;save()}
function subjAcc(s){let t=0,c=0;for(const q of D.questions)if(q.s===s&&ST.ans&&ST.ans[q.id]){t++;if(ST.ans[q.id][1]>0&&!(ST.wrong||{})[q.id])c++}return [t,c]}
function feedback(q,ch){
  const ok=ch===q.a, co=q.o[q.a];
  let h=`<div class="fb ${ok?'ok':'bad'}" role="status">`;
  if(ch==null)h+=`<h4>Not answered</h4><p><b>Correct answer: ${L[q.a]}. ${co}</b></p>`;
  else if(ok)h+=`<h4>✓ Correct — ${L[q.a]}. ${co}</h4>`;
  else h+=`<h4>✗ Not quite. You chose ${L[ch]}. ${q.o[ch]}</h4>${q.w[ch]?`<p><b>Why that's wrong:</b> ${q.w[ch]}</p>`:''}<p><b>Correct answer: ${L[q.a]}. ${co}</b></p>`;
  h+=`<p><b>${ok?'Why it is right':'Explanation'}:</b> ${q.e||('The correct answer is '+co+'.')}</p>`;
  const others=Object.keys(q.w).filter(k=>+k!==ch&&+k!==q.a);
  if(others.length)h+=`<details><summary>About the other options</summary>${others.map(k=>`<p>${L[k]}. ${q.o[k]} — ${q.w[k]}</p>`).join('')}</details>`;
  h+=`<p><button class="bm" data-notes="${q.s}">Read ${esc(D.subjects[q.s])} notes →</button></p></div>`;
  return h}
function qcard(q,i,n,opts){
  const bm=(ST.bm||{})[q.id];
  let h=`<div class="qcard"><div class="qhead"><span>Q ${i+1} of ${n} · ${esc(D.subjects[q.s])}</span><button class="bm" data-bm="${q.id}">${bm?'★ Bookmarked':'☆ Bookmark'}</button></div><div class="qtext">${q.q}</div>`;
  q.o.forEach((o,k)=>{let c='';if(opts.reveal){if(k===q.a)c='ok';else if(k===opts.ch)c='bad'}else if(k===opts.ch)c='sel';
    h+=`<button class="opt ${c}" data-k="${k}" ${opts.reveal?'disabled':''}><span class="k">${L[k]}</span><span>${o}</span></button>`});
  if(opts.reveal)h+=feedback(q,opts.ch);
  return h+'</div>'}
function bind(){
  app.querySelectorAll('[data-bm]').forEach(b=>b.onclick=()=>{ST.bm=ST.bm||{};const id=b.dataset.bm;if(ST.bm[id])delete ST.bm[id];else ST.bm[id]=1;save();b.textContent=ST.bm[id]?'★ Bookmarked':'☆ Bookmark'});
  app.querySelectorAll('[data-notes]').forEach(b=>b.onclick=()=>showNotes(b.dataset.notes,true));
}
function dialog(msg,yes,no,cb){$('#dlg').innerHTML=`<div class="dlg"><div><p>${msg}</p><div class="row"><button class="btn" id="dy">${yes}</button><button class="btn alt" id="dn">${no}</button></div></div></div>`;$('#dy').onclick=()=>{$('#dlg').innerHTML='';cb(true)};$('#dn').onclick=()=>{$('#dlg').innerHTML='';cb(false)};$('#dy').focus()}

/* ---------- HOME ---------- */
function home(){
  stopTimer();location.hash='';
  const n=D.questions.length,st=D.questions.filter(q=>q.p==='study').length,pr=n-st;
  const done=Object.keys(ST.ans||{}).length,wr=Object.keys(ST.wrong||{}).length,bmn=Object.keys(ST.bm||{}).length;
  app.innerHTML=`<div class="hero"><h1>M.Sc. Forestry entrance MCQ trainer</h1>
  <p>${n.toLocaleString()} MCQs across all 11 AFU syllabus subjects. Every answer comes with an explanation, right or wrong.</p>
  <div class="stats"><span class="pill">${done} attempted</span><span class="pill">${wr} to revise</span><span class="pill">${bmn} bookmarked</span></div>
  <svg viewBox="0 0 360 150" aria-hidden="true"><defs><linearGradient id="tr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9be0b5"/><stop offset="1" stop-color="#2f8a58"/></linearGradient></defs>
  <path d="M0 150 L60 70 L95 110 L150 40 L200 105 L240 60 L300 120 L360 80 L360 150Z" fill="rgba(255,255,255,.12)"/>
  ${[[40,95,1],[90,105,.8],[150,85,1.2],[205,100,.9],[260,92,1.1],[315,104,.85]].map(([x,y,s])=>`<g transform="translate(${x} ${y}) scale(${s})"><rect x="-3" y="18" width="6" height="30" fill="#5b3b22"/><path d="M0 -36 L22 4 L10 4 L26 26 L-26 26 L-10 4 L-22 4Z" fill="url(#tr)"/><path d="M0 -36 L22 4 L10 4 L26 26 L0 26Z" fill="rgba(0,0,0,.12)"/></g>`).join('')}</svg></div>
  <div class="modes">
   <button class="mode" id="mS"><h3>Study MCQs</h3><p>Learn subject by subject: key notes, then ${st} guided questions with instant explanations.</p><div class="n">${st}</div></button>
   <button class="mode" id="mP"><h3>Practice MCQs</h3><p>Random drills from ${pr} questions. Pick subjects and size; see your score as you go.</p><div class="n">${pr}</div></button>
   <button class="mode" id="mM"><h3>Model mock tests</h3><p>10 full papers in the AFU pattern: 90 questions, 70 minutes, 40% to pass, reviewed after you submit.</p><div class="n">10 + random</div></button>
  </div>
  <h2>Revise</h2><div class="list">
   <button class="item" id="rW"><span class="t"><b>My mistakes</b><div class="s">Questions you last answered wrong</div></span><b>${wr}</b></button>
   <button class="item" id="rB"><span class="t"><b>Bookmarks</b><div class="s">Questions you starred</div></span><b>${bmn}</b></button>
  </div>
  <h2>Progress by subject</h2><div class="list">${Object.entries(D.subjects).map(([s,name])=>{const tot=D.questions.filter(q=>q.s===s).length,[t,c]=subjAcc(s);return `<button class="item" data-sub="${s}"><span class="t"><b>${esc(name)}</b><div class="s">${D.quota[s]} questions in exam · ${tot} in bank · ${t} attempted${t?` · ${Math.round(c/t*100)}% correct`:''}</div><div class="bar"><i style="width:${tot?t/tot*100:0}%"></i></div></span>›</button>`}).join('')}</div>
  <p class="mut" style="font-size:13px;margin-top:18px">Questions follow the AFU M.Sc. Forestry entrance syllabus and the 2082/83 notice (90 MCQs, 70 minutes). They are practice questions, not AFU's own past papers. Progress is saved in this browser only.</p>`;
  $('#mS').onclick=studyHome;$('#mP').onclick=practiceSetup;$('#mM').onclick=mockHome;
  $('#rW').onclick=()=>review('wrong');$('#rB').onclick=()=>review('bm');
  app.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>studySubject(b.dataset.sub));
  window.scrollTo(0,0)}

/* ---------- STUDY ---------- */
function studyHome(){
  location.hash='study';
  app.innerHTML=`<h1>Study MCQs</h1><p class="mut">Choose a subject. Read its key notes, then work through the study questions in order. You'll get feedback after each answer.</p><div class="list">${Object.entries(D.subjects).map(([s,n])=>{const qs=D.questions.filter(q=>q.s===s&&q.p==='study');const pos=(ST.pos||{})[s]||0;return `<button class="item" data-sub="${s}"><span class="t"><b>${esc(n)}</b><div class="s">${qs.length} study MCQs · ${D.quota[s]} in exam${pos?` · resume at Q${pos+1}`:''}</div><div class="bar"><i style="width:${qs.length?Math.min(pos/qs.length,1)*100:0}%"></i></div></span>›</button>`}).join('')}</div>`;
  app.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>studySubject(b.dataset.sub));window.scrollTo(0,0)}
function showNotes(s,back){
  app.innerHTML=`<div class="row" style="justify-content:space-between"><h1>${esc(D.subjects[s])}</h1></div><div class="row" style="margin-bottom:12px"><button class="btn" id="go">Start study MCQs</button>${back?'<button class="btn alt" id="bk">Back to question</button>':''}</div><div class="notes">${N[s]||''}</div>`;
  $('#go').onclick=()=>studyRun(s);if(back)$('#bk').onclick=()=>window.__resume&&window.__resume();window.scrollTo(0,0)}
function studySubject(s){showNotes(s,false)}
function studyRun(s){
  const qs=D.questions.filter(q=>q.s===s&&q.p==='study');ST.pos=ST.pos||{};let i=Math.min(ST.pos[s]||0,qs.length-1),ch=null,rev=false;
  const draw=()=>{const q=qs[i];app.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:10px"><b>Study · ${esc(D.subjects[s])}</b><button class="chip" id="nt">Key notes</button></div>${qcard(q,i,qs.length,{ch,reveal:rev})}<div class="nav"><button class="btn alt" id="pv" ${i?'':'disabled'}>‹ Previous</button><button class="btn" id="nx">${i<qs.length-1?'Next ›':'Finish'}</button></div>`;
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(rev)return;ch=+b.dataset.k;rev=true;rec(q,ch);draw()});
    $('#pv').onclick=()=>{i--;ch=null;rev=false;ST.pos[s]=i;save();draw()};
    $('#nx').onclick=()=>{if(i<qs.length-1){i++;ch=null;rev=false;ST.pos[s]=i;save();draw();window.scrollTo(0,0)}else{ST.pos[s]=0;save();studyHome()}};
    $('#nt').onclick=()=>{window.__resume=draw;showNotes(s,true)};bind()};
  window.__resume=draw;draw()}

/* ---------- PRACTICE ---------- */
function practiceSetup(){
  location.hash='practice';
  const sel=new Set(Object.keys(D.subjects));let size=20,mode='all';
  const draw=()=>{app.innerHTML=`<h1>Practice MCQs</h1><p class="mut">Random questions with instant feedback. Choose subjects, how many questions, and which questions to draw.</p>
  <h2>Subjects</h2><div class="row"><button class="chip" id="all">All</button><button class="chip" id="none">None</button>${Object.entries(D.subjects).map(([s,n])=>`<button class="chip" data-s="${s}" aria-pressed="${sel.has(s)}">${esc(n)}</button>`).join('')}</div>
  <h2>Number of questions</h2><div class="row">${[10,20,30,50,100].map(n=>`<button class="chip" data-n="${n}" aria-pressed="${n===size}">${n}</button>`).join('')}</div>
  <h2>Draw from</h2><div class="row">${[['all','Practice pool'],['new','Not yet attempted'],['every','Whole bank (study + practice)']].map(([k,t])=>`<button class="chip" data-m="${k}" aria-pressed="${k===mode}">${t}</button>`).join('')}</div>
  <p style="margin-top:20px"><button class="btn" id="go" ${sel.size?'':'disabled'}>Start practice</button></p>`;
  app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const s=b.dataset.s;sel.has(s)?sel.delete(s):sel.add(s);draw()});
  app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{size=+b.dataset.n;draw()});
  app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;draw()});
  $('#all').onclick=()=>{Object.keys(D.subjects).forEach(s=>sel.add(s));draw()};$('#none').onclick=()=>{sel.clear();draw()};
  $('#go').onclick=()=>{let pool=D.questions.filter(q=>sel.has(q.s)&&(mode==='every'||mode==='new'||q.p==='practice'));if(mode==='new')pool=pool.filter(q=>!(ST.ans||{})[q.id]);if(!pool.length){dialog('No questions match. Try another option.','OK','Close',()=>{});return}
    runList(shuffle(pool).slice(0,size),'Practice')}};draw()}
function runList(qs,label){
  let i=0,ch=null,rev=false,right=0,ans=[];
  const draw=()=>{const q=qs[i];app.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:10px"><b>${label}</b><span class="mut">Score ${right}/${ans.length}</span></div>${qcard(q,i,qs.length,{ch,reveal:rev})}<div class="nav"><button class="btn alt" id="qt">End session</button><button class="btn" id="nx" ${rev?'':'disabled'}>${i<qs.length-1?'Next ›':'See result'}</button></div>`;
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(rev)return;ch=+b.dataset.k;rev=true;rec(q,ch);ans[i]=ch;if(ch===q.a)right++;draw()});
    $('#nx').onclick=()=>{if(i<qs.length-1){i++;ch=null;rev=false;draw();window.scrollTo(0,0)}else done()};
    $('#qt').onclick=()=>done();bind()};
  const done=()=>result(qs.slice(0,ans.length),ans,label,null);
  window.__resume=draw;draw()}

/* ---------- MOCK ---------- */
function mockHome(){
  location.hash='mock';stopTimer();
  const best=ST.mock||{};
  app.innerHTML=`<h1>Model mock tests</h1><p class="mut">Each paper follows the AFU M.Sc. Forestry pattern: 90 MCQs, 70 minutes, pass mark 40%. Answers are shown only after you submit.</p>
  <div class="list">${D.mocks.map((m,k)=>`<button class="item" data-m="${k}"><span class="t"><b>Model Set ${k+1}</b><div class="s">90 questions · 70 min${best[k]!=null?` · best ${best[k]}/90`:''}</div></span>›</button>`).join('')}
  <button class="item" data-m="r"><span class="t"><b>Random mock</b><div class="s">A fresh 90-question paper in AFU proportions</div></span>›</button></div>
  <h2>Question split</h2><table class="res"><tr><th>Subject</th><th>Questions</th></tr>${Object.entries(D.quota).map(([s,n])=>`<tr><td>${esc(D.subjects[s])}</td><td>${n}</td></tr>`).join('')}<tr><th>Total</th><th>90</th></tr></table>`;
  app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const k=b.dataset.m;let ids;if(k==='r'){ids=[];for(const[s,n]of Object.entries(D.quota))ids.push(...shuffle(D.questions.filter(q=>q.s===s).map(q=>q.id)).slice(0,n))}else ids=D.mocks[+k];
    dialog(`Start ${k==='r'?'a random mock':'Model Set '+(+k+1)}? The 70-minute timer starts now.`,'Start','Cancel',y=>{if(y)mockRun(ids.map(id=>QI[id]),k)})});
  window.scrollTo(0,0)}
function mockRun(qs,key){
  let i=0;const ans=Array(qs.length).fill(null),flag=new Set();let left=70*60;const end=Date.now()+left*1000;
  const tick=()=>{left=Math.max(0,Math.round((end-Date.now())/1000));$('#tm').innerHTML=`<span class="timer">${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}</span>`;if(!left)finish()};
  stopTimer();timerH=setInterval(tick,1000);tick();
  const finish=()=>{stopTimer();const sc=qs.reduce((a,q,k)=>a+(ans[k]===q.a),0);qs.forEach((q,k)=>{if(ans[k]!=null)rec(q,ans[k])});if(key!=='r'){ST.mock=ST.mock||{};ST.mock[key]=Math.max(ST.mock[key]||0,sc);save()}result(qs,ans,key==='r'?'Random mock':'Model Set '+(+key+1),true)};
  const draw=()=>{const q=qs[i];const nA=ans.filter(x=>x!=null).length;
    app.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:10px"><b>${key==='r'?'Random mock':'Model Set '+(+key+1)}</b><span class="mut">${nA}/90 answered</span></div>${qcard(q,i,qs.length,{ch:ans[i],reveal:false})}
    <div class="nav"><button class="btn alt" id="pv" ${i?'':'disabled'}>‹ Prev</button><button class="btn alt" id="fl">${flag.has(i)?'Unflag':'Flag'}</button><button class="btn alt" id="cl">Clear</button><button class="btn" id="nx">${i<qs.length-1?'Next ›':'Review'}</button></div>
    <div class="pal">${qs.map((_,k)=>`<button class="${ans[k]!=null?'a':''} ${flag.has(k)?'f':''} ${k===i?'c':''}" data-j="${k}" aria-label="Question ${k+1}">${k+1}</button>`).join('')}</div>
    <p style="margin-top:16px"><button class="btn warn" id="sb">Submit paper</button></p>`;
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ans[i]=+b.dataset.k;draw()});
    app.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{i=+b.dataset.j;draw()});
    $('#pv').onclick=()=>{i--;draw()};$('#nx').onclick=()=>{if(i<qs.length-1){i++;draw()}else window.scrollTo(0,document.body.scrollHeight)};
    $('#fl').onclick=()=>{flag.has(i)?flag.delete(i):flag.add(i);draw()};$('#cl').onclick=()=>{ans[i]=null;draw()};
    $('#sb').onclick=()=>dialog(`Submit now? ${90-ans.filter(x=>x!=null).length} unanswered.`,'Submit','Keep going',y=>{if(y)finish()});bind()};
  window.__resume=draw;draw()}

/* ---------- RESULT & REVIEW ---------- */
function result(qs,ans,label,isMock){
  location.hash='result';
  const n=qs.length,sc=qs.reduce((a,q,k)=>a+(ans[k]===q.a),0),pct=n?sc/n*100:0;
  const by={};qs.forEach((q,k)=>{by[q.s]=by[q.s]||[0,0,0];by[q.s][0]++;if(ans[k]===q.a)by[q.s][1]++;else if(ans[k]==null)by[q.s][2]++});
  let filt='all';
  const draw=()=>{const idx=qs.map((q,k)=>k).filter(k=>filt==='all'||(filt==='wrong'&&ans[k]!=null&&ans[k]!==qs[k].a)||(filt==='skip'&&ans[k]==null)||(filt==='right'&&ans[k]===qs[k].a));
  app.innerHTML=`<h1>${esc(label)} — result</h1><div class="qcard"><div class="score">${sc}/${n}</div><p style="font-size:18px;margin:8px 0">${pct.toFixed(1)}% ${isMock?(pct>=40?'· <b style="color:var(--ok)">Above the 40% pass mark</b>':'· <b style="color:var(--bad)">Below the 40% pass mark</b>'):''}</p>
  <table class="res"><tr><th>Subject</th><th>Correct</th><th>Wrong</th><th>Skipped</th></tr>${Object.entries(by).map(([s,[t,c,u]])=>`<tr><td>${esc(D.subjects[s])}</td><td>${c}/${t}</td><td>${t-c-u}</td><td>${u}</td></tr>`).join('')}</table></div>
  <h2>Review answers</h2><div class="row">${[['all','All'],['wrong','Wrong'],['skip','Skipped'],['right','Right']].map(([k,t])=>`<button class="chip" data-f="${k}" aria-pressed="${k===filt}">${t}</button>`).join('')}</div>
  <div class="list" style="margin-top:12px">${idx.map(k=>qcard(qs[k],k,n,{ch:ans[k],reveal:true})).join('')||'<p class="mut">Nothing here.</p>'}</div>
  <div class="nav"><button class="btn" id="hm">Home</button>${isMock?'<button class="btn alt" id="mk">Mock tests</button>':''}</div>`;
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filt=b.dataset.f;draw()});
  $('#hm').onclick=home;if(isMock)$('#mk').onclick=mockHome;bind();
  app.querySelectorAll('[data-notes]').forEach(b=>b.onclick=()=>{window.__resume=draw;showNotes(b.dataset.notes,true)})};
  draw();window.scrollTo(0,0)}
function review(kind){
  const ids=Object.keys((kind==='wrong'?ST.wrong:ST.bm)||{}).map(Number).filter(id=>QI[id]);
  if(!ids.length){dialog(kind==='wrong'?'No mistakes saved yet. Questions you answer wrongly will appear here.':'No bookmarks yet. Tap ☆ Bookmark on any question.','OK','Close',()=>{});return}
  runList(shuffle(ids.map(id=>QI[id])),kind==='wrong'?'My mistakes':'Bookmarks')}

window.__back=()=>{if($('#dlg').innerHTML){$('#dlg').innerHTML='';return 'stay'}if(timerH){dialog('Leave the mock test? Your answers will be lost.','Leave','Stay',y=>{if(y)home()});return 'stay'}if(!location.hash||location.hash==='#'){return 'exit'}home();return 'stay'};
$('#homeBtn').onclick=()=>{if(timerH){dialog('Leave the mock test? Your answers will be lost.','Leave','Stay',y=>{if(y)home()})}else home()};
Promise.resolve([window.__Q,window.__N]).then(([d,n])=>{
  D=d;N=n;D.questions.forEach(q=>QI[q.id]=q);ST=load();
  const h=location.hash.slice(1);({study:studyHome,practice:practiceSetup,mock:mockHome}[h]||home)();
}).catch(e=>{app.innerHTML='<p>Could not load the question bank. Please reload the page.</p>'});
}
</script>
</body>
</html>
